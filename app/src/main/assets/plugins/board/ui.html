<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Board</title>
<style>
  /*
    Desktop windows (html.shell) get a board that fills the window; in the
    phone app it is a plain page with a tall board, because percentage heights
    are a black panel in that WebView. No percentage heights here.
  */
  :root {
    --b-bg: var(--bg, #0b0f0c); --b-fg: var(--fg, #e6ede7); --b-surface: var(--surface, #121915);
    --b-high: var(--surface-high, #1a231e); --b-line: var(--outline, #26332b); --b-muted: var(--muted, #8b9a90);
    --b-accent: var(--accent, #5fd38d); --b-soft: var(--accent-soft, rgba(95, 211, 141, .14));
    --b-on: var(--on-accent, #04140a); --b-danger: var(--danger, #e8635f);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--b-bg); color: var(--b-fg); font: 13.5px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  html.shell body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--b-high); border: 1px solid var(--b-line); border-radius: 9px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--b-accent); }
  button.on, button.primary { background: var(--b-accent); color: var(--b-on); border-color: var(--b-accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { background: var(--b-bg); border: 1px solid var(--b-line); border-radius: 8px; padding: 5px 8px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--b-accent); }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: var(--b-surface); border-bottom: 1px solid var(--b-line); }
  .group { display: flex; gap: 4px; align-items: center; padding-right: 8px; border-right: 1px solid var(--b-line); }
  .group:last-child { border-right: 0; }
  #boardName { width: 150px; font-weight: 600; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--b-line); }
  .swatch.on { border-color: var(--b-fg); box-shadow: 0 0 0 2px var(--b-accent); }
  .muted { color: var(--b-muted); font-size: 12px; }

  #vp { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        height: max(460px, calc(100vh - 130px)); cursor: grab;
        background-color: var(--b-bg);
        background-image: radial-gradient(circle, var(--b-line) 1.2px, transparent 1.3px); }
  html.shell #vp { flex: 1 1 auto; height: auto; min-height: 0; }
  #vp.panning { cursor: grabbing; }
  #vp.connecting, #vp.connecting .card { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
  #wires path.line { fill: none; stroke: var(--b-muted); stroke-width: 2.2; }
  #wires path.hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; pointer-events: stroke; }
  #wires g.sel path.line { stroke: var(--b-accent); stroke-width: 3; }
  #wires text { font-size: 12px; fill: var(--b-fg); paint-order: stroke; stroke: var(--b-bg); stroke-width: 4px; }
  #wires .temp { stroke: var(--b-accent); stroke-dasharray: 6 5; }

  .card { position: absolute; border-radius: 12px; background: var(--card, var(--b-surface)); color: var(--ink, var(--b-fg));
          border: 1px solid rgba(0, 0, 0, .14); box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .55); display: flex; flex-direction: column;
          overflow: hidden; cursor: move; }
  .card.none { border-color: var(--b-line); }
  .card.sel { outline: 2.5px solid var(--b-accent); outline-offset: 2px; z-index: 5; }
  .card.target { outline: 2.5px dashed var(--b-accent); outline-offset: 3px; }
  .card.heading { background: transparent; border: 0; box-shadow: none; }
  .card.heading .text { font-size: 26px; font-weight: 800; letter-spacing: -.01em; padding: 6px 4px; }
  .text { padding: 10px 12px; white-space: pre-wrap; word-break: break-word; outline: none; flex: 1 1 auto; overflow: auto; min-height: 1.5em; }
  .text[contenteditable="true"] { cursor: text; background: rgba(255, 255, 255, .12); user-select: text; -webkit-user-select: text; }
  .text:empty::before { content: attr(data-hint); opacity: .5; }
  .todo .title { font-weight: 700; padding: 9px 12px 2px; flex: 0 0 auto; min-height: 0; overflow: visible; }
  .items { padding: 2px 10px 8px; overflow: auto; flex: 1 1 auto; }
  .item { display: flex; gap: 7px; align-items: flex-start; padding: 2px 0; }
  .item input { margin-top: 3px; width: 16px; height: 16px; flex: 0 0 auto; }
  .item span { flex: 1; outline: none; min-height: 1.3em; }
  .item.done span { text-decoration: line-through; opacity: .6; }
  .item span[contenteditable="true"] { background: rgba(255, 255, 255, .14); cursor: text; user-select: text; -webkit-user-select: text; }
  .add-item { margin: 0 10px 8px; padding: 2px 8px; font-size: 12px; background: rgba(0, 0, 0, .08); border-color: rgba(0, 0, 0, .15); color: inherit; align-self: flex-start; }
  .card img { width: 100%; flex: 1 1 auto; min-height: 0; object-fit: cover; pointer-events: none; display: block; }
  .card.image .text { flex: 0 0 auto; padding: 6px 10px; font-size: 12px; }
  .card.link a { color: inherit; font-size: 12px; word-break: break-all; padding: 0 12px 10px; display: block; opacity: .8; }
  .dot { position: absolute; right: 3px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%;
         background: var(--b-accent); border: 2px solid var(--b-bg); display: none; cursor: crosshair; z-index: 2; }
  .grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; display: none;
          background: linear-gradient(135deg, transparent 50%, var(--b-accent) 50%); border-bottom-right-radius: 12px; }
  .card.sel .dot, .card.sel .grip { display: block; }
  .card:hover .dot { display: block; }
  .yellow { --card: #fbe38e; --ink: #2a2310; } .green { --card: #b7ebc6; --ink: #0f2a18; }
  .blue { --card: #b9d6ff; --ink: #0d1d33; } .pink { --card: #f9c3d9; --ink: #33101f; }
  .purple { --card: #d6c6ff; --ink: #1d1236; } .orange { --card: #ffd0a6; --ink: #331b06; }
  .gray { --card: #d9dde0; --ink: #1c2125; }
  .hint { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); text-align: center; color: var(--b-muted); pointer-events: none; }
  .hint b { display: block; color: var(--b-fg); font-size: 16px; margin-bottom: 4px; }
  .zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center; background: var(--b-surface);
          border: 1px solid var(--b-line); border-radius: 10px; padding: 4px; }
  .zoom span { min-width: 44px; text-align: center; font-size: 12px; }
  .sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 9; }
  .sheet[hidden] { display: none; }
  .sheet .box { background: var(--b-surface); border: 1px solid var(--b-line); border-radius: 14px; width: min(460px, 100%);
                max-height: max(300px, 86vh); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .sheet h3 { margin: 0; font-size: 15px; }
  .sheet .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .sheet .list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; }
  .sheet .list button { text-align: left; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--b-high); border: 1px solid var(--b-accent);
           padding: 7px 13px; border-radius: 10px; z-index: 10; max-width: 90%; }
</style>
</head>
<body>
<div class="bar">
  <div class="group">
    <select id="boards" title="Your boards"></select>
    <input id="boardName" spellcheck="false" title="This board's name">
    <button id="bNew" title="A new board">New</button>
    <button id="bDel" title="Delete this board">Delete</button>
  </div>
  <div class="group">
    <button data-add="note" title="A note (N)">+ Note</button>
    <button data-add="heading" title="A heading">+ Heading</button>
    <button data-add="todo" title="A to-do list">+ To-do</button>
    <button data-add="image" title="An image - or paste one">+ Image</button>
    <button data-add="link" title="A link">+ Link</button>
  </div>
  <div class="group">
    <button id="bConnect" title="Connect: tap one card, then another (or drag a card's green dot)">↗ Connect</button>
    <span id="swatches"></span>
    <button id="bRemove" title="Delete what is selected (Del)">✕</button>
  </div>
  <div class="group">
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    <button id="bExport" title="Save the board as a Markdown file in your workspace">Export .md</button>
    <span class="muted" id="saved"></span>
  </div>
</div>
<div id="vp" data-pycmd-drag>
  <div id="world"><svg id="wires"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--b-muted, #8b9a90)"/></marker></defs><g id="links"></g><path id="temp" class="temp" fill="none"/></svg></div>
  <div class="hint" id="hint" hidden><b>An empty board</b>Double-click (or double-tap) anywhere to add a note.</div>
  <div class="zoom"><button id="zOut" title="Zoom out">−</button><span id="zLabel">100%</span><button id="zIn" title="Zoom in">+</button><button id="zFit" title="Show everything">Fit</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
(function () {
  'use strict';
  if (!/Android/i.test(navigator.userAgent || '')) document.documentElement.classList.add('shell');
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['none', 'yellow', 'green', 'blue', 'pink', 'purple', 'orange', 'gray'];
  var SW = { none: 'transparent', yellow: '#fbe38e', green: '#b7ebc6', blue: '#b9d6ff', pink: '#f9c3d9', purple: '#d6c6ff', orange: '#ffd0a6', gray: '#d9dde0' };
  var B = null, id = '', sel = null, past = [], future = [], connect = false, connectFrom = null, saveTimer = 0, editing = null;
  var vp = $('vp'), world = $('world');
  var n = 0;
  function uid(p) { n += 1; return p + Date.now().toString(36) + n; }
  function call(name, payload) { return pycmd.call(name, payload || {}).then(function (r) { return r || {}; }, function (e) { return { ok: false, error: String(e) }; }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var tt = 0;
  function toast(t) { var x = document.querySelector('.toast') || document.body.appendChild(el('div', 'toast')); x.textContent = t; x.hidden = false; clearTimeout(tt); tt = setTimeout(function () { x.hidden = true; }, 2400); }

  // ------------------------------------------------------------ model
  function card(cid) { return B.cards.filter(function (c) { return c.id === cid; })[0]; }
  function snap() { return JSON.stringify({ cards: B.cards, links: B.links, name: B.name }); }
  function remember() { past.push(snap()); if (past.length > 80) past.shift(); future = []; buttons(); }
  function restore(t) { var d = JSON.parse(t); B.cards = d.cards; B.links = d.links; B.name = d.name; $('boardName').value = B.name; if (sel && sel.kind === 'card' ? !card(sel.id) : sel) sel = null; draw(); changed(); }
  function undo() { if (!past.length) return; future.push(snap()); restore(past.pop()); }
  function redo() { if (!future.length) return; past.push(snap()); restore(future.pop()); }
  function buttons() { $('bUndo').disabled = !past.length; $('bRedo').disabled = !future.length; }
  function changed() {
    buttons(); $('saved').textContent = '…'; clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      call('save', { id: id, board: B }).then(function (r) { $('saved').textContent = r.ok ? 'saved' : 'not saved'; if (!r.ok) toast(r.error || 'That did not save.'); });
    }, 700);
  }

  // ------------------------------------------------------------ view
  function applyView() {
    var v = B.view; world.style.transform = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.z + ')';
    vp.style.backgroundSize = (22 * v.z) + 'px ' + (22 * v.z) + 'px';
    vp.style.backgroundPosition = v.x + 'px ' + v.y + 'px';
    $('zLabel').textContent = Math.round(v.z * 100) + '%';
  }
  function toWorld(cx, cy) { var r = vp.getBoundingClientRect(), v = B.view; return { x: (cx - r.left - v.x) / v.z, y: (cy - r.top - v.y) / v.z }; }
  function zoomAt(z, cx, cy) {
    var r = vp.getBoundingClientRect(), v = B.view, nz = Math.min(3, Math.max(.2, z));
    var px = cx == null ? r.width / 2 : cx - r.left, py = cy == null ? r.height / 2 : cy - r.top;
    v.x = px - (px - v.x) * (nz / v.z); v.y = py - (py - v.y) * (nz / v.z); v.z = nz; applyView();
  }
  function fit() {
    if (!B.cards.length) { B.view = { x: 0, y: 0, z: 1 }; applyView(); return; }
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    B.cards.forEach(function (c) { x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y); x1 = Math.max(x1, c.x + c.w); y1 = Math.max(y1, c.y + c.h); });
    var r = vp.getBoundingClientRect(), pad = 40, z = Math.min(1.4, (r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0));
    z = Math.max(.2, z); B.view = { z: z, x: (r.width - (x1 - x0) * z) / 2 - x0 * z, y: (r.height - (y1 - y0) * z) / 2 - y0 * z }; applyView();
  }

  // ------------------------------------------------------------ drawing
  function draw() {
    Array.prototype.slice.call(world.querySelectorAll('.card')).forEach(function (x) { x.remove(); });
    B.cards.forEach(function (c) { world.appendChild(cardEl(c)); });
    wires(); mark(); $('hint').hidden = B.cards.length > 0; applyView();
  }
  function editable(node, c, field, after) {
    node.addEventListener('dblclick', function (e) { e.stopPropagation(); startEdit(node, c, field, after); });
    node.dataset.editable = '1';
  }
  function startEdit(node, c, field, after) {
    if (editing === node) return;
    stopEdit(); editing = node; node.contentEditable = 'true'; node.focus();
    var range = document.createRange(); range.selectNodeContents(node); range.collapse(false);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
    var before = snap(), first = true;
    node.oninput = function () { if (first) { past.push(before); future = []; first = false; } field(node.innerText.replace(/\n$/, '')); if (after) after(); changed(); };
    node.onkeydown = function (e) { e.stopPropagation(); if (e.key === 'Escape') { stopEdit(); } if (e.key === 'Enter' && node.dataset.single) { e.preventDefault(); stopEdit(); if (after) after('enter'); } };
  }
  function stopEdit() { if (!editing) return; editing.contentEditable = 'false'; editing.oninput = null; editing.onkeydown = null; editing = null; wires(); }
  function cardEl(c) {
    var d = el('div', 'card ' + c.type + ' ' + (c.color || 'none'));
    d.dataset.id = c.id; place(d, c);
    if (c.type === 'image') {
      var img = el('img'); img.src = c.src || ''; img.alt = c.text || 'image'; d.appendChild(img);
      var cap = el('div', 'text', c.text || ''); cap.dataset.hint = 'caption'; d.appendChild(cap);
      editable(cap, c, function (v) { c.text = v; });
    } else if (c.type === 'todo') {
      var title = el('div', 'text title', c.text || ''); title.dataset.hint = 'List'; title.dataset.single = '1'; d.appendChild(title);
      editable(title, c, function (v) { c.text = v; });
      var list = el('div', 'items');
      (c.items || []).forEach(function (it, i) {
        var row = el('div', 'item' + (it.done ? ' done' : ''));
        var box = el('input'); box.type = 'checkbox'; box.checked = !!it.done;
        box.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
        box.addEventListener('change', function () { remember(); it.done = box.checked; row.classList.toggle('done', it.done); changed(); });
        var t = el('span', '', it.t); t.dataset.single = '1';
        editable(t, c, function (v) { it.t = v; }, function (how) {
          if (how === 'enter') { remember(); c.items.splice(i + 1, 0, { t: '', done: false }); redrawCard(c); var spans = world.querySelectorAll('.card[data-id="' + c.id + '"] .item span'); if (spans[i + 1]) startEditLater(spans[i + 1]); }
        });
        row.appendChild(box); row.appendChild(t); list.appendChild(row);
      });
      d.appendChild(list);
      var add = el('button', 'add-item', '+ item');
      add.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      add.addEventListener('click', function () { remember(); c.items = c.items || []; c.items.push({ t: '', done: false }); grow(c); redrawCard(c); changed(); var spans = world.querySelectorAll('.card[data-id="' + c.id + '"] .item span'); startEditLater(spans[spans.length - 1]); });
      d.appendChild(add);
    } else {
      var tx = el('div', 'text', c.text || ''); tx.dataset.hint = c.type === 'heading' ? 'Heading' : c.type === 'link' ? 'Title' : 'Write something…';
      if (c.type === 'heading') tx.dataset.single = '1';
      d.appendChild(tx); editable(tx, c, function (v) { c.text = v; });
      if (c.type === 'link') { var a = el('a', '', c.url || ''); a.href = c.url || '#'; a.target = '_blank'; a.rel = 'noopener'; a.addEventListener('pointerdown', function (e) { e.stopPropagation(); }); d.appendChild(a); }
    }
    d.appendChild(el('div', 'dot')); d.appendChild(el('div', 'grip'));
    return d;
  }
  function startEditLater(node) { if (node) setTimeout(function () { node.dispatchEvent(new MouseEvent('dblclick', { bubbles: true })); }, 0); }
  function redrawCard(c) { var old = world.querySelector('.card[data-id="' + c.id + '"]'); var neu = cardEl(c); if (old) old.replaceWith(neu); else world.appendChild(neu); mark(); wires(); }
  function grow(c) { if (c.type === 'todo') c.h = Math.max(c.h, 92 + (c.items || []).length * 24); }
  function place(d, c) { d.style.left = c.x + 'px'; d.style.top = c.y + 'px'; d.style.width = c.w + 'px'; d.style.height = c.h + 'px'; }
  function mark() {
    Array.prototype.forEach.call(world.querySelectorAll('.card'), function (x) { x.classList.toggle('sel', !!sel && sel.kind === 'card' && sel.id === x.dataset.id); });
    var c = sel && sel.kind === 'card' ? card(sel.id) : null;
    Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (s) { s.classList.toggle('on', !!c && (c.color || 'none') === s.dataset.c); s.disabled = !c; });
    $('bRemove').disabled = !sel;
  }
  function edgePoint(c, tx, ty) {
    var cx = c.x + c.w / 2, cy = c.y + c.h / 2, dx = tx - cx, dy = ty - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    var s = Math.min(Math.abs((c.w / 2 + 6) / (dx || 1e-9)), Math.abs((c.h / 2 + 6) / (dy || 1e-9)));
    return { x: cx + dx * s, y: cy + dy * s };
  }
  function wires() {
    var g = $('links'); g.innerHTML = ''; var NS = 'http://www.w3.org/2000/svg';
    B.links = B.links.filter(function (l) { return card(l.from) && card(l.to); });
    B.links.forEach(function (l) {
      var a = card(l.from), b = card(l.to);
      var p = edgePoint(a, b.x + b.w / 2, b.y + b.h / 2), q = edgePoint(b, a.x + a.w / 2, a.y + a.h / 2);
      var d = 'M' + p.x + ',' + p.y + ' L' + q.x + ',' + q.y;
      var grp = document.createElementNS(NS, 'g'); grp.dataset.id = l.id; grp.style.color = 'var(--b-muted)';
      if (sel && sel.kind === 'link' && sel.id === l.id) { grp.setAttribute('class', 'sel'); grp.style.color = 'var(--b-accent)'; }
      var line = document.createElementNS(NS, 'path'); line.setAttribute('d', d); line.setAttribute('class', 'line'); line.setAttribute('marker-end', 'url(#arrow)');
      var hit = document.createElementNS(NS, 'path'); hit.setAttribute('d', d); hit.setAttribute('class', 'hit');
      grp.appendChild(line); grp.appendChild(hit);
      if (l.label) { var t = document.createElementNS(NS, 'text'); t.setAttribute('x', (p.x + q.x) / 2); t.setAttribute('y', (p.y + q.y) / 2 - 6); t.setAttribute('text-anchor', 'middle'); t.textContent = l.label; grp.appendChild(t); }
      hit.addEventListener('pointerdown', function (e) { e.stopPropagation(); sel = { kind: 'link', id: l.id }; mark(); wires(); });
      hit.addEventListener('dblclick', function (e) { e.stopPropagation(); ask('Label this arrow', [{ name: 'label', value: l.label || '', hint: 'e.g. then, needs, because' }]).then(function (v) { if (v) { remember(); l.label = v.label.slice(0, 60); wires(); changed(); } }); });
      g.appendChild(grp);
    });
  }

  // ------------------------------------------------------------ adding
  function centre() { var r = vp.getBoundingClientRect(); return toWorld(r.left + r.width / 2, r.top + r.height / 2); }
  function addCard(type, extra, at) {
    remember();
    var p = at || centre(), size = { note: [220, 140], heading: [320, 60], todo: [240, 140], image: [260, 220], link: [240, 90] }[type] || [220, 140];
    var c = Object.assign({ id: uid('c'), type: type, x: Math.round(p.x - size[0] / 2), y: Math.round(p.y - size[1] / 2), w: size[0], h: size[1],
      color: type === 'heading' || type === 'image' ? 'none' : (type === 'todo' ? 'green' : type === 'link' ? 'blue' : 'yellow'), text: '' }, extra || {});
    if (type === 'todo' && !c.items) c.items = [{ t: '', done: false }];
    if (!at) free(c);
    B.cards.push(c); sel = { kind: 'card', id: c.id }; draw(); changed();
    if (type !== 'image' && type !== 'link') {
      var node = world.querySelector('.card[data-id="' + c.id + '"] ' + (type === 'todo' ? '.item span' : '.text'));
      startEditLater(node);
    }
    return c;
  }
  // The nearest spot to the middle of the screen where a new card covers nothing.
  function free(c) {
    var hits = function (x, y) { return B.cards.some(function (o) { return x < o.x + o.w + 16 && x + c.w + 16 > o.x && y < o.y + o.h + 16 && y + c.h + 16 > o.y; }); };
    var x0 = c.x, y0 = c.y;
    for (var ring = 0; ring < 14; ring++) {
      for (var k = 0; k < Math.max(1, ring * 8); k++) {
        var a = (k / Math.max(1, ring * 8)) * Math.PI * 2, x = Math.round(x0 + Math.cos(a) * ring * 60), y = Math.round(y0 + Math.sin(a) * ring * 45);
        if (!hits(x, y)) { c.x = x; c.y = y; return; }
      }
    }
  }
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('could not read it')); };
      reader.onload = function () { shrinkUrl(reader.result).then(resolve, reject); };
      reader.readAsDataURL(file);
    });
  }
  function shrinkUrl(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var max = 1000, s = Math.min(1, max / Math.max(img.width, img.height));
        if (s === 1 && url.length < 400000) return resolve({ src: url, w: img.width, h: img.height });
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve({ src: cv.toDataURL('image/jpeg', .86), w: cv.width, h: cv.height });
      };
      img.onerror = function () { reject(new Error('that is not an image')); };
      img.src = url;
    });
  }
  function addImage(found) {
    var w = Math.min(320, found.w || 260), h = Math.round(w * ((found.h || 200) / (found.w || 260))) + 30;
    addCard('image', { src: found.src, w: w, h: Math.min(420, h) });
  }
  function imageSheet() {
    var box = sheet('Add an image');
    var pick = el('button', 'primary', 'Choose a file…'); pick.onclick = function () { close(); $('file').click(); };
    box.appendChild(el('div', 'muted', 'Or paste an image straight onto the board (Ctrl+V), or pick one from your workspace:'));
    var list = el('div', 'list', 'loading…'); box.appendChild(list);
    var row = el('div', 'row'); var cancel = el('button', '', 'Cancel'); cancel.onclick = close; row.appendChild(cancel); row.appendChild(pick); box.appendChild(row);
    call('images').then(function (r) {
      list.textContent = ''; if (!(r.files || []).length) list.appendChild(el('div', 'muted', 'No images in the workspace yet.'));
      (r.files || []).forEach(function (f) {
        var b = el('button', '', f); b.onclick = function () {
          call('image', { path: f }).then(function (got) { if (!got.ok) return toast(got.error); shrinkUrl(got.src).then(function (x) { close(); addImage(x); }); });
        }; list.appendChild(b);
      });
    });
  }
  $('file').addEventListener('change', function () { var f = this.files[0]; this.value = ''; if (f) shrink(f).then(addImage, function (e) { toast(e.message); }); });
  document.addEventListener('paste', function (e) {
    if (editing) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) { e.preventDefault(); shrink(items[i].getAsFile()).then(addImage); return; }
    }
    var text = e.clipboardData && e.clipboardData.getData('text');
    if (text) { e.preventDefault(); if (/^https?:\/\/\S+$/.test(text.trim())) addCard('link', { url: text.trim(), text: text.trim().replace(/^https?:\/\//, '').split('/')[0] }); else addCard('note', { text: text.slice(0, 4000) }); }
  });

  // ------------------------------------------------------------ sheets
  var closeSheet = null;
  function sheet(title) { var box = $('sheetBox'); box.innerHTML = ''; box.appendChild(el('h3', '', title)); $('sheet').hidden = false; return box; }
  function close() { $('sheet').hidden = true; if (closeSheet) { var f = closeSheet; closeSheet = null; f(null); } }
  function ask(title, fields) {
    return new Promise(function (resolve) {
      var box = sheet(title), inputs = {};
      fields.forEach(function (f) { var i = el('input'); i.value = f.value || ''; i.placeholder = f.hint || ''; i.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') ok.click(); if (e.key === 'Escape') close(); }); inputs[f.name] = i; box.appendChild(i); });
      var row = el('div', 'row'), cancel = el('button', '', 'Cancel'), ok = el('button', 'primary', 'OK');
      cancel.onclick = close;
      ok.onclick = function () { var out = {}; Object.keys(inputs).forEach(function (k) { out[k] = inputs[k].value.trim(); }); closeSheet = null; $('sheet').hidden = true; resolve(out); };
      row.appendChild(cancel); row.appendChild(ok); box.appendChild(row);
      closeSheet = resolve; setTimeout(function () { var first = box.querySelector('input'); if (first) first.focus(); }, 30);
    });
  }
  $('sheet').addEventListener('pointerdown', function (e) { if (e.target === $('sheet')) close(); });

  // ------------------------------------------------------------ pointers
  var pointers = {}, gesture = null, lastTap = { t: 0, id: '' };
  function linkExists(a, b) { return B.links.some(function (l) { return (l.from === a && l.to === b) || (l.from === b && l.to === a); }); }
  function makeLink(a, b) { if (!a || !b || a === b || linkExists(a, b)) return; remember(); B.links.push({ id: uid('l'), from: a, to: b, label: '' }); wires(); changed(); }
  vp.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.zoom') || e.target.closest('input,button,a')) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (ids.length === 2) {   // pinch
      var a = pointers[ids[0]], b = pointers[ids[1]];
      gesture = { kind: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), z: B.view.z, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, vx: B.view.x, vy: B.view.y };
      return;
    }
    var cardNode = e.target.closest('.card');
    if (cardNode && cardNode.contains(editing) && e.target.closest('[contenteditable="true"]')) return;   // typing
    stopEdit();
    try { vp.setPointerCapture(e.pointerId); } catch (x) { /* fine */ }
    var now = Date.now();
    if (cardNode) {
      var c = card(cardNode.dataset.id);
      if (connect) {
        if (!connectFrom) { connectFrom = c.id; sel = { kind: 'card', id: c.id }; mark(); toast('Now tap the card to connect it to.'); }
        else { makeLink(connectFrom, c.id); connectFrom = null; toggleConnect(false); }
        return;
      }
      sel = { kind: 'card', id: c.id }; mark(); wires();
      if (e.target.classList.contains('dot')) { gesture = { kind: 'wire', from: c.id }; return; }
      if (e.target.classList.contains('grip')) { gesture = { kind: 'resize', c: c, x: e.clientX, y: e.clientY, w: c.w, h: c.h, moved: false }; return; }
      // a second tap on the same card edits it - double-click for fingers
      if (e.pointerType !== 'mouse' && lastTap.id === c.id && now - lastTap.t < 380) {
        var t = e.target.closest('[data-editable]') || cardNode.querySelector('[data-editable]');
        if (t) { gesture = null; lastTap = { t: 0, id: '' }; t.dispatchEvent(new MouseEvent('dblclick', { bubbles: true })); return; }
      }
      lastTap = { t: now, id: c.id };
      gesture = { kind: 'move', c: c, x: e.clientX, y: e.clientY, cx: c.x, cy: c.y, moved: false };
    } else {
      if (connect) { connectFrom = null; toggleConnect(false); }
      if (e.pointerType !== 'mouse' && lastTap.id === '' && now - lastTap.t < 380) { lastTap = { t: 0, id: 'x' }; addCard('note', null, toWorld(e.clientX, e.clientY)); return; }
      lastTap = { t: now, id: '' };
      sel = null; mark(); wires();
      gesture = { kind: 'pan', x: e.clientX, y: e.clientY, vx: B.view.x, vy: B.view.y }; vp.classList.add('panning');
    }
  });
  vp.addEventListener('pointermove', function (e) {
    if (pointers[e.pointerId]) pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (!gesture) return;
    var z = B.view.z;
    if (gesture.kind === 'pinch') {
      var ids = Object.keys(pointers); if (ids.length < 2) return;
      var a = pointers[ids[0]], b = pointers[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      B.view.x = gesture.vx; B.view.y = gesture.vy; B.view.z = gesture.z; zoomAt(gesture.z * d / gesture.d, gesture.cx, gesture.cy);
    } else if (gesture.kind === 'pan') {
      B.view.x = gesture.vx + e.clientX - gesture.x; B.view.y = gesture.vy + e.clientY - gesture.y; applyView();
    } else if (gesture.kind === 'move') {
      var dx = (e.clientX - gesture.x) / z, dy = (e.clientY - gesture.y) / z;
      if (!gesture.moved && Math.abs(dx) + Math.abs(dy) < 3 / z) return;
      if (!gesture.moved) { remember(); gesture.moved = true; }
      gesture.c.x = Math.round(gesture.cx + dx); gesture.c.y = Math.round(gesture.cy + dy);
      place(world.querySelector('.card[data-id="' + gesture.c.id + '"]'), gesture.c); wires();
    } else if (gesture.kind === 'resize') {
      if (!gesture.moved) { remember(); gesture.moved = true; }
      gesture.c.w = Math.max(90, Math.round(gesture.w + (e.clientX - gesture.x) / z)); gesture.c.h = Math.max(40, Math.round(gesture.h + (e.clientY - gesture.y) / z));
      place(world.querySelector('.card[data-id="' + gesture.c.id + '"]'), gesture.c); wires();
    } else if (gesture.kind === 'wire') {
      var from = card(gesture.from), p = toWorld(e.clientX, e.clientY), s = edgePoint(from, p.x, p.y);
      $('temp').setAttribute('d', 'M' + s.x + ',' + s.y + ' L' + p.x + ',' + p.y);
      var over = document.elementFromPoint(e.clientX, e.clientY), target = over && over.closest('.card');
      Array.prototype.forEach.call(world.querySelectorAll('.card.target'), function (x) { x.classList.remove('target'); });
      if (target && target.dataset.id !== gesture.from) target.classList.add('target');
    }
  });
  function endPointer(e) {
    delete pointers[e.pointerId];
    if (!gesture) return;
    if (gesture.kind === 'wire') {
      $('temp').setAttribute('d', '');
      var over = document.elementFromPoint(e.clientX, e.clientY), target = over && over.closest('.card');
      Array.prototype.forEach.call(world.querySelectorAll('.card.target'), function (x) { x.classList.remove('target'); });
      if (target) makeLink(gesture.from, target.dataset.id);
    }
    if ((gesture.kind === 'move' || gesture.kind === 'resize') && gesture.moved) changed();
    if (gesture.kind === 'pan' || gesture.kind === 'pinch') saveView();
    if (gesture.kind === 'pinch' && Object.keys(pointers).length) { gesture = null; return; }
    gesture = null; vp.classList.remove('panning');
  }
  var viewTimer = 0;
  function saveView() { clearTimeout(viewTimer); viewTimer = setTimeout(changed, 900); }
  vp.addEventListener('pointerup', endPointer);
  vp.addEventListener('pointercancel', endPointer);
  vp.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) >= 40 && !e.deltaX) zoomAt(B.view.z * Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY);
    else { B.view.x -= e.deltaX; B.view.y -= e.deltaY; applyView(); }
    saveView();
  }, { passive: false });
  vp.addEventListener('dblclick', function (e) { if (e.target === vp || e.target === world || e.target.id === 'wires') addCard('note', null, toWorld(e.clientX, e.clientY)); });

  // ------------------------------------------------------------ toolbar
  function toggleConnect(on) { connect = on; connectFrom = null; $('bConnect').classList.toggle('on', on); vp.classList.toggle('connecting', on); if (on) toast('Tap a card, then the card it leads to.'); }
  $('bConnect').onclick = function () { toggleConnect(!connect); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (b) {
    b.onclick = function () {
      var t = b.dataset.add;
      if (t === 'image') return imageSheet();
      if (t === 'link') return ask('Add a link', [{ name: 'url', hint: 'https://…' }, { name: 'text', hint: 'title (optional)' }]).then(function (v) {
        if (!v || !v.url) return; var url = /^[a-z]+:\/\//i.test(v.url) ? v.url : 'https://' + v.url;
        addCard('link', { url: url, text: v.text || url.replace(/^https?:\/\//, '').split('/')[0] });
      });
      addCard(t);
    };
  });
  COLORS.forEach(function (c) {
    var s = el('button', 'swatch'); s.dataset.c = c; s.title = c === 'none' ? 'No colour' : c; s.style.background = SW[c];
    if (c === 'none') s.style.backgroundImage = 'linear-gradient(135deg, transparent 45%, var(--b-danger) 45%, var(--b-danger) 55%, transparent 55%)';
    s.onclick = function () { var x = sel && sel.kind === 'card' && card(sel.id); if (!x) return; remember(); x.color = c; redrawCard(x); changed(); };
    $('swatches').appendChild(s);
  });
  function removeSel() {
    if (!sel) return; remember();
    if (sel.kind === 'card') { var gone = sel.id; B.cards = B.cards.filter(function (c) { return c.id !== gone; }); B.links = B.links.filter(function (l) { return l.from !== gone && l.to !== gone; }); }
    else B.links = B.links.filter(function (l) { return l.id !== sel.id; });
    sel = null; draw(); changed();
  }
  $('bRemove').onclick = removeSel;
  $('bUndo').onclick = undo; $('bRedo').onclick = redo;
  $('zIn').onclick = function () { zoomAt(B.view.z * 1.25); saveView(); };
  $('zOut').onclick = function () { zoomAt(B.view.z / 1.25); saveView(); };
  $('zFit').onclick = function () { fit(); saveView(); };
  $('bExport').onclick = function () { call('export_markdown', { board: B }).then(function (r) { toast(r.ok ? 'Saved ' + r.path : (r.error || 'That did not save.')); }); };
  $('boardName').addEventListener('input', function (e) { B.name = e.target.value; refreshList(); changed(); });
  $('boardName').addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') e.target.blur(); });
  $('boards').onchange = function () { open($('boards').value); };
  $('bNew').onclick = function () {
    ask('A new board', [{ name: 'name', value: 'New board' }]).then(function (v) {
      if (!v) return; call('create', { name: v.name || 'New board' }).then(function (r) { if (!r.ok) return toast(r.error); open(r.id); });
    });
  };
  var delArmed = 0;
  $('bDel').onclick = function () {
    if (!delArmed) { $('bDel').textContent = 'Sure?'; delArmed = setTimeout(function () { delArmed = 0; $('bDel').textContent = 'Delete'; }, 3000); return; }
    clearTimeout(delArmed); delArmed = 0; $('bDel').textContent = 'Delete';
    call('remove', { id: id }).then(function () { open(''); toast('Board deleted.'); });
  };
  document.addEventListener('keydown', function (e) {
    if (editing || !$('sheet').hidden || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { if (e.key === 'Escape') { stopEdit(); close(); } return; }
    var mod = e.ctrlKey || e.metaKey, k = (e.key || '').toLowerCase();
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if (mod && k === 'd' && sel && sel.kind === 'card') { e.preventDefault(); var c = card(sel.id); if (c) { var copy = JSON.parse(JSON.stringify(c)); copy.id = uid('c'); copy.x += 24; copy.y += 24; remember(); B.cards.push(copy); sel = { kind: 'card', id: copy.id }; draw(); changed(); } }
    else if (k === 'delete' || k === 'backspace') { e.preventDefault(); removeSel(); }
    else if (k === 'escape') { sel = null; toggleConnect(false); mark(); wires(); }
    else if (k === 'n' && !mod) { e.preventDefault(); addCard('note'); }
    else if (k === 'enter' && sel && sel.kind === 'card') { var node = world.querySelector('.card[data-id="' + sel.id + '"] [data-editable]'); if (node) { e.preventDefault(); node.dispatchEvent(new MouseEvent('dblclick', { bubbles: true })); } }
  });

  // ------------------------------------------------------------ boards
  var listing = [];
  function refreshList() {
    var s = $('boards'); s.innerHTML = '';
    listing.forEach(function (b) { var o = el('option', '', b.id === id ? (B.name || 'Board') : b.name); o.value = b.id; if (b.id === id) o.selected = true; s.appendChild(o); });
  }
  function open(which) {
    return call('listing').then(function (l) {
      listing = l.boards || [];
      return call('load', { id: which || l.current });
    }).then(function (r) {
      if (!r.ok) return toast(r.error || 'That board would not open.');
      id = r.id; B = r.board; B.cards = B.cards || []; B.links = B.links || []; B.view = B.view || { x: 0, y: 0, z: 1 };
      past = []; future = []; sel = null; buttons(); $('boardName').value = B.name || 'Board'; refreshList(); draw();
      if (!B.view.x && !B.view.y && B.view.z === 1 && B.cards.length) fit();
      $('saved').textContent = '';
    });
  }
  open('');
}());
</script>
</body>
</html>
