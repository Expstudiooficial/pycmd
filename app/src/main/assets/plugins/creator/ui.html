<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Creator</title>
<style>
  :root {
    --c-bg: var(--bg, #0b0f0c); --c-fg: var(--fg, #e6ede7); --c-surface: var(--surface, #121915);
    --c-high: var(--surface-high, #1a231e); --c-line: var(--outline, #26332b); --c-muted: var(--muted, #8b9a90);
    --c-accent: var(--accent, #5fd38d); --c-soft: var(--accent-soft, rgba(95, 211, 141, .14));
    --c-on: var(--on-accent, #04140a); --c-danger: var(--danger, #e8635f); --c-warn: var(--warning, #e5a945);
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  /*
    Two layouts. On a desktop (html.shell) the panel is an app: three panes
    that fill the window, each scrolling on its own, sized with vh. On the
    phone it is a plain page that scrolls, because a percentage height - or a
    body that is its own scroller - is a black screen in the app's WebView.
    No percentage heights anywhere: tools/test_bundled.py checks.
  */
  body { margin: 0; background: var(--c-bg); color: var(--c-fg); font: 13.5px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  html.shell body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--c-high); border: 1px solid var(--c-line); border-radius: 9px; padding: 6px 11px;
           cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
  button:hover { border-color: var(--c-accent); }
  button:disabled { opacity: .45; cursor: default; border-color: var(--c-line); }
  button.primary { background: var(--c-accent); color: var(--c-on); border-color: var(--c-accent); font-weight: 600; }
  button.ghost { background: none; border-color: transparent; }
  button.ghost:hover { background: var(--c-high); }
  button.icon { padding: 4px 8px; min-width: 30px; }
  input, select, textarea { background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 8px; padding: 6px 9px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-soft); }
  .muted { color: var(--c-muted); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--c-line);
         background: var(--c-surface); flex-wrap: wrap; }
  .langs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1 1 260px; min-width: 0; }
  .langs::-webkit-scrollbar { display: none; }
  .chip { border-radius: 999px; padding: 4px 11px; font-size: 12.5px; background: transparent; }
  .chip.on { background: var(--c-soft); border-color: var(--c-accent); color: var(--c-accent); font-weight: 600; }
  .name { width: 150px; font-weight: 600; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .saved { font-size: 11.5px; min-width: 52px; text-align: right; }
  .main { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr) minmax(280px, 40%); }
  .pane { display: flex; flex-direction: column; border-right: 1px solid var(--c-line); min-width: 0; }
  .scroll { overflow: auto; }
  .palette .scroll, #codeView { max-height: 560px; }
  html.shell .main { flex: 1 1 auto; min-height: 0; }
  html.shell .pane { min-height: 0; }
  html.shell .scroll { flex: 1 1 auto; min-height: 0; max-height: none; overscroll-behavior: contain; }
  .pane:last-child { border-right: 0; }
  .pane-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--c-line); }
  .pane-head b { flex: 1; }
  .search { width: 100%; }
  .cats { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px 6px; scrollbar-width: thin; flex: 0 0 auto; }
  .cats .chip { flex: 0 0 auto; }
  .cats .chip { padding: 2px 9px; font-size: 11.5px; }
  .pal { margin: 4px 10px; padding: 7px 9px 7px 12px; border-radius: 9px; background: var(--c-surface);
         border: 1px solid var(--c-line); border-left: 4px solid hsl(var(--h) 60% 55%); cursor: pointer; user-select: none; }
  .pal:hover { border-color: hsl(var(--h) 60% 55%); background: var(--c-high); }
  .pal code { display: block; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .pal small { color: var(--c-muted); font-size: 11.5px; }
  .group { padding: 10px 12px 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--c-muted); }
  .tree { padding: 10px 10px 80px; }
  .blk { position: relative; margin: 3px 0; border-radius: 9px; background: var(--c-surface); border: 1px solid var(--c-line);
         border-left: 4px solid hsl(var(--h) 60% 55%); }
  .blk.sel { border-color: var(--c-accent); box-shadow: 0 0 0 2px var(--c-soft); }
  .line { display: flex; align-items: center; gap: 4px; padding: 4px 6px; flex-wrap: wrap; min-height: 32px; }
  .grip { cursor: grab; color: var(--c-muted); padding: 0 3px; user-select: none; font-size: 12px; }
  .tx { font-family: var(--mono); font-size: 12.5px; white-space: pre; }
  .slot { font-family: var(--mono); font-size: 12.5px; padding: 2px 6px; border-radius: 6px; min-width: 34px;
          background: var(--c-bg); border: 1px solid var(--c-line); color: var(--c-accent); }
  select.slot { padding: 2px 4px; }
  .tools { margin-left: auto; display: none; gap: 2px; }
  .blk.sel > .line .tools { display: flex; }
  .tools button { padding: 1px 6px; font-size: 12px; border-radius: 6px; }
  .kids { margin: 0 6px 6px 18px; padding-left: 6px; border-left: 2px dashed var(--c-line); min-height: 8px; }
  .close { font-family: var(--mono); font-size: 12.5px; color: var(--c-muted); padding: 0 8px 5px 26px; }
  .hole { margin: 4px 0; padding: 6px; border: 1px dashed var(--c-line); border-radius: 8px; color: var(--c-muted); font-size: 12px; text-align: center; }
  .drop-before { box-shadow: 0 -3px 0 var(--c-accent); }
  .drop-after { box-shadow: 0 3px 0 var(--c-accent); }
  .drop-in { outline: 2px dashed var(--c-accent); outline-offset: 2px; }
  .empty { padding: 34px 18px; text-align: center; color: var(--c-muted); }
  .empty b { display: block; color: var(--c-fg); font-size: 15px; margin-bottom: 6px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 4px 12px; border-radius: 999px; }
  .tabs button.on { background: var(--c-soft); color: var(--c-accent); border-color: var(--c-accent); }
  .code { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; padding: 8px 0; counter-reset: n; }
  .code div { padding: 0 12px 0 0; white-space: pre; cursor: pointer; }
  .code div::before { counter-increment: n; content: counter(n); display: inline-block; width: 38px; text-align: right;
                      padding-right: 10px; color: var(--c-muted); opacity: .6; user-select: none; }
  .code div:hover { background: var(--c-high); }
  .code div.hi { background: var(--c-soft); }
  .code div.bad { background: rgba(232, 99, 95, .14); }
  .k { color: var(--kw, #c792ea); } .s { color: var(--str, #c3e88d); } .n { color: var(--num, #f78c6c); }
  .c { color: var(--comment, #6a7a70); font-style: italic; } .f { color: var(--def, #82aaff); }
  .problems { margin: 8px 10px; padding: 8px 10px; border-radius: 8px; background: rgba(229, 169, 69, .12); color: var(--c-warn); font-size: 12.5px; }
  .runbox { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  html.shell .runbox { flex: 1 1 auto; min-height: 0; }
  .runbox[hidden] { display: none; }
  .runbox textarea { min-height: 54px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
  .out { min-height: 120px; max-height: 420px; overflow: auto; margin: 0; padding: 10px 12px; border-radius: 10px;
         background: var(--c-bg); border: 1px solid var(--c-line); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .out .e { color: var(--c-danger); } .out .i { color: var(--c-muted); }
  .preview { height: 420px; border: 1px solid var(--c-line); border-radius: 10px; background: #fff; width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  html.shell .out { flex: 1 1 auto; max-height: none; }
  html.shell .preview { flex: 1 1 auto; height: auto; min-height: 200px; }
  .nav { display: none; border-bottom: 1px solid var(--c-line); background: var(--c-surface); }
  .nav button { flex: 1; border: 0; border-radius: 0; background: none; padding: 10px 4px; font-size: 12.5px; color: var(--c-muted); }
  .nav button.on { color: var(--c-accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--c-accent); }
  @media (max-width: 1050px) {
    .main { grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); }
    .main .side { display: none; }
    .main[data-view="code"] .side, .main[data-view="run"] .side { display: flex; grid-column: 2; }
    .main[data-view="code"] .script, .main[data-view="run"] .script { display: none; }
    .nav { display: flex; }
    .nav [data-v="blocks"] { display: none; }
  }
  @media (max-width: 700px) {
    .main { grid-template-columns: minmax(0, 1fr); }
    .main .pane { display: none; border-right: 0; }
    .main[data-view="blocks"] .palette, .main[data-view="script"] .script,
    .main[data-view="code"] .side, .main[data-view="run"] .side { display: flex; grid-column: 1; }
    .nav [data-v="blocks"] { display: block; }
    .name { width: 110px; }
    .hide-s { display: none; }
    .tools { display: flex; }
  }
  .sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 9; }
  .sheet[hidden] { display: none; }
  .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 14px; width: min(640px, 100%);
          max-height: max(320px, 86vh); display: flex; flex-direction: column; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .7); }
  .card header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--c-line); }
  .card header b { flex: 1; font-size: 15px; }
  .card .body { padding: 12px 14px 16px; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--c-line); border-radius: 10px; background: var(--c-bg); }
  .item .grow { flex: 1; min-width: 0; }
  .item .grow div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--c-high); border: 1px solid var(--c-accent);
           padding: 8px 14px; border-radius: 10px; z-index: 10; max-width: 90%; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
</style>
</head>
<body>
<div class="top">
  <div class="langs" id="langs"></div>
  <input class="name" id="name" spellcheck="false" title="Project name - also the file name">
  <span class="saved muted" id="saved"></span>
  <div class="acts">
    <button class="icon ghost" id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="icon ghost" id="redo" title="Redo (Ctrl+Y)">↷</button>
    <button id="bExamples" title="Start from an example">Examples</button>
    <button id="bImport" title="Turn code into blocks">Import code</button>
    <button id="bProjects" class="hide-s" title="Your saved projects">Projects</button>
    <button id="bSave" title="Save as a real file in your workspace (Ctrl+S)">Save file</button>
    <button id="bRun" class="primary" title="Run it (Ctrl+Enter)">▶ Run</button>
  </div>
</div>
<nav class="nav" id="nav">
  <button data-v="blocks">Blocks</button><button data-v="script" class="on">Script</button>
  <button data-v="code">Code</button><button data-v="run">Run</button>
</nav>
<div class="main" id="main" data-view="script">
  <aside class="pane palette">
    <div class="pane-head"><input class="search" id="search" placeholder="Search blocks…  ( / )" spellcheck="false"></div>
    <div class="cats" id="cats"></div>
    <div class="scroll" id="palette"></div>
  </aside>
  <section class="pane script">
    <div class="pane-head">
      <b id="count">Script</b>
      <button class="ghost icon" id="bOut" title="Move the selected block out of its parent (Shift+Tab)">⇤</button>
      <button class="ghost icon" id="bIn" title="Move the selected block into the one above (Tab)">⇥</button>
      <button class="ghost" id="bClear" title="Remove every block">Clear</button>
    </div>
    <div class="scroll" id="scriptScroll"><div class="tree" id="tree"></div></div>
  </section>
  <section class="pane side">
    <div class="pane-head">
      <div class="tabs"><button data-t="code" class="on">Code</button><button data-t="run">Run</button></div>
      <span style="flex:1"></span>
      <button class="ghost" id="bCopy" title="Copy the code">Copy</button>
    </div>
    <div class="scroll" id="codeView"></div>
    <div class="runbox" id="runView" hidden></div>
  </section>
</div>
<div class="sheet" id="sheet" hidden><div class="card"><header><b id="sheetTitle"></b>
  <button class="ghost icon" id="sheetClose" title="Close">✕</button></header><div class="body" id="sheetBody"></div></div></div>
<script>
(function () {
  'use strict';
  // The app's Android WebView says Android; a desktop window gets the shell.
  if (!/Android/i.test(navigator.userAgent || '')) document.documentElement.classList.add('shell');
  var $ = function (id) { return document.getElementById(id); };
  var S = { langs: [], lang: 'python', cats: {}, byId: {}, project: null, ids: {}, drafts: {}, sel: '', filter: '', cat: '',
            past: [], future: [], built: null, run: null, side: 'code', input: {}, timer: 0, saveTimer: 0, folder: '' };
  var uidN = 0;
  function uid() { uidN += 1; return 'u' + Date.now().toString(36) + uidN; }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hue(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  var toastTimer = 0;
  function toast(text) {
    var t = document.querySelector('.toast'); if (!t) { t = el('div', 'toast'); document.body.appendChild(t); }
    t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function call(name, payload) {
    return pycmd.call(name, payload || {}).then(function (r) { return r || {}; }, function (e) { return { ok: false, error: String(e && e.message || e) }; });
  }
  function meta(id) { return S.langs.filter(function (l) { return l.id === (id || S.lang); })[0] || { name: id || S.lang, extension: '', about: '' }; }

  // ---------------------------------------------------------------- the tree
  function blocks() { return S.project.blocks; }
  function ensure(nodes) { (nodes || []).forEach(function (n) { if (!n.uid) n.uid = uid(); n.values = n.values || {}; if (n.children) ensure(n.children); }); return nodes || []; }
  function find(wanted, nodes, parent) {
    nodes = nodes || blocks();
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].uid === wanted) return { node: nodes[i], list: nodes, index: i, parent: parent || null };
      if (nodes[i].children) { var f = find(wanted, nodes[i].children, nodes[i]); if (f) return f; }
    }
    return null;
  }
  function count(nodes) { return (nodes || []).reduce(function (a, n) { return a + 1 + count(n.children); }, 0); }
  function spec(n) { return n && S.byId[n.block]; }
  function fresh(id) {
    var sp = S.byId[id], values = {};
    (sp.slots || []).forEach(function (s) { values[s.name] = s.default || ''; });
    var n = { block: id, values: values, uid: uid() }; if (sp.wrap) n.children = []; return n;
  }
  function clone(n) { var c = JSON.parse(JSON.stringify(n)); (function re(x) { x.uid = uid(); (x.children || []).forEach(re); })(c); return c; }
  function contains(node, wanted) { return (node.children || []).some(function (c) { return c.uid === wanted || contains(c, wanted); }); }

  // ---------------------------------------------------------------- history
  function snap() { return JSON.stringify({ name: S.project.name, blocks: S.project.blocks }); }
  function remember() { S.past.push(snap()); if (S.past.length > 150) S.past.shift(); S.future = []; }
  function restore(text) { var d = JSON.parse(text); S.project.name = d.name; S.project.blocks = ensure(d.blocks); $('name').value = d.name || ''; changed(true); }
  function undo() { if (!S.past.length) return; S.future.push(snap()); restore(S.past.pop()); }
  function redo() { if (!S.future.length) return; S.past.push(snap()); restore(S.future.pop()); }

  // ---------------------------------------------------------------- editing
  function insert(id) {
    if (!S.byId[id]) return;
    remember();
    var n = fresh(id), at = S.sel && find(S.sel);
    if (at && spec(at.node) && spec(at.node).wrap) { at.node.children = at.node.children || []; at.node.children.push(n); }
    else if (at) at.list.splice(at.index + 1, 0, n);
    else blocks().push(n);
    S.sel = n.uid; changed(true);
    var b = document.querySelector('.blk[data-uid="' + n.uid + '"]'); if (b) b.scrollIntoView({ block: 'nearest' });
    if (document.body.clientWidth <= 700) toast('Added "' + S.byId[id].label + '"');
  }
  function removeSel() { var at = S.sel && find(S.sel); if (!at) return; remember(); at.list.splice(at.index, 1);
    var next = at.list[at.index] || at.list[at.index - 1] || at.parent; S.sel = next ? next.uid : ''; changed(true); }
  function duplicate() { var at = S.sel && find(S.sel); if (!at) return; remember(); var c = clone(at.node); at.list.splice(at.index + 1, 0, c); S.sel = c.uid; changed(true); }
  function move(step) {
    var at = S.sel && find(S.sel); if (!at) return; var to = at.index + step; if (to < 0 || to >= at.list.length) return;
    remember(); at.list.splice(at.index, 1); at.list.splice(to, 0, at.node); changed(true);
  }
  function indent() {
    var at = S.sel && find(S.sel); if (!at || at.index === 0) return toast('There is no block above this one to go inside.');
    var above = at.list[at.index - 1]; if (!spec(above) || !spec(above).wrap) return toast('"' + (spec(above) ? spec(above).label : 'That block') + '" cannot hold blocks.');
    remember(); at.list.splice(at.index, 1); above.children = above.children || []; above.children.push(at.node); changed(true);
  }
  function outdent() {
    var at = S.sel && find(S.sel); if (!at || !at.parent) return toast('This block is already at the top level.');
    var up = find(at.parent.uid); remember(); at.list.splice(at.index, 1); up.list.splice(up.index + 1, 0, at.node); changed(true);
  }
  function placeNode(node, target, where) {
    if (where === 'end' || !target) { blocks().push(node); return; }
    var t = find(target); if (!t) { blocks().push(node); return; }
    if (where === 'inside') { t.node.children = t.node.children || []; t.node.children.push(node); return; }
    t.list.splice(t.index + (where === 'after' ? 1 : 0), 0, node);
  }

  // ---------------------------------------------------------------- palette
  function drawCats() {
    var box = $('cats'); box.innerHTML = '';
    [{ name: '' }].concat(S.cats[S.lang] || []).forEach(function (c) {
      var b = el('button', 'chip' + (S.cat === c.name ? ' on' : ''), esc(c.name || 'All'));
      b.onclick = function () { S.cat = c.name; drawCats(); drawPalette(); };
      box.appendChild(b);
    });
  }
  function drawPalette() {
    var box = $('palette'); box.innerHTML = '';
    var q = S.filter.trim().toLowerCase(), shown = 0, frag = document.createDocumentFragment();
    (S.cats[S.lang] || []).forEach(function (c) {
      if (S.cat && c.name !== S.cat) return;
      var rows = c.blocks.filter(function (b) { return !q || (b.label + ' ' + b.preview + ' ' + c.name + ' ' + (b.about || '')).toLowerCase().indexOf(q) >= 0; });
      if (!rows.length) return;
      frag.appendChild(el('div', 'group', esc(c.name) + ' · ' + rows.length));
      rows.forEach(function (b) {
        var d = el('div', 'pal', '<code>' + esc(b.preview || b.label) + (b.closing ? '\n' + esc(b.closing) : '') + '</code><small>' + esc(b.label) + '</small>');
        d.style.setProperty('--h', hue(c.name)); d.title = b.about || b.label; d.draggable = true;
        d.onclick = function () { insert(b.id); };
        d.ondragstart = function (e) { e.dataTransfer.setData('text/plain', 'new:' + b.id); e.dataTransfer.effectAllowed = 'copy'; };
        frag.appendChild(d); shown++;
      });
    });
    box.appendChild(frag);
    if (!shown) box.appendChild(el('div', 'empty', '<b>Nothing matches</b>Try another word, or clear the search.'));
  }

  // ---------------------------------------------------------------- script
  var PH = /@@|@([a-z_][a-z0-9_]*)@/g;
  function slotInput(n, s) {
    var v = n.values[s.name] != null ? n.values[s.name] : (s.default || ''), f;
    if (s.kind === 'choice') {
      f = el('select', 'slot');
      (s.options || []).forEach(function (o) { var op = el('option', '', esc(o)); op.value = o; if (o === v) op.selected = true; f.appendChild(op); });
    } else {
      f = el('input', 'slot'); f.value = v; f.spellcheck = false; f.placeholder = s.label || s.name;
      if (s.kind === 'number') f.inputMode = 'decimal';
      var fit = function () { f.style.width = Math.min(420, Math.max(40, (f.value.length || f.placeholder.length) * 7.6 + 18)) + 'px'; };
      fit(); f.addEventListener('input', fit);
    }
    f.title = s.label + (s.kind === 'string' ? ' (text - the quotes are added for you)' : '');

    f.addEventListener('focus', function () { if (S.sel !== n.uid) { S.sel = n.uid; markSel(); } first = true; });

        if (!r.ok) return toast(r.error || 'That could not be read.');
        var p = r.project, nodes = ensure(p.blocks);
        var done = function () { closeSheet(); toast(r.matched + ' lines became blocks' + (r.raw ? ', ' + r.raw + ' kept as code' : '') + '.'); };
        if (mode === 'add' && p.language === S.lang) { remember(); nodes.forEach(function (n) { blocks().push(n); }); changed(true); done(); return; }
        keep().then(function () {
          load({ name: files.value ? files.value.split('/').pop().replace(/\.[^.]+$/, '') : 'imported', language: p.language, blocks: nodes }, '');
          changed(false); done();
        });
      });
    };
    var top = el('div', 'row'); top.appendChild(langSel); top.appendChild(files); b.appendChild(top);
    b.appendChild(text);
    b.appendChild(el('div', 'muted', 'A line one of the blocks writes becomes that block, with its values filled in. Anything else becomes an "any line of code" block, so nothing is lost.'));
    var row = el('div', 'row'), x = el('button', 'primary', 'Open as a new script'), y = el('button', '', 'Add to this script');
    x.onclick = function () { go('new'); }; y.onclick = function () { go('add'); }; row.appendChild(x); row.appendChild(y); b.appendChild(row);
    sheet('Import code', b); setTimeout(function () { text.focus(); }, 50);
  }
  function saveFile() {
    var b = body(), name = el('input'), folder = el('input'), ok = el('button', 'primary', 'Save');
    name.value = S.project.name || 'untitled'; folder.placeholder = 'folder (optional), e.g. creator'; folder.value = S.folder || '';
    [name, folder].forEach(function (f) { f.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') ok.click(); }); });
    ok.onclick = function () {
      S.project.name = name.value.trim() || 'untitled'; $('name').value = S.project.name; S.folder = folder.value.trim();
      call('save_file', { project: project(), name: S.project.name, folder: S.folder }).then(function (r) {
        if (r.ok) { S.project.file = r.path; closeSheet(); toast('Saved ' + r.path); keep(); } else toast(r.error || 'That did not save.');
      });
    };
    b.appendChild(el('div', 'muted', 'A real ' + meta().extension + ' file in your workspace - the editor opens it and the console runs it.'));
    b.appendChild(name); b.appendChild(folder); var row = el('div', 'row'); row.appendChild(ok); b.appendChild(row);
    sheet('Save as a file', b); setTimeout(function () { name.select(); }, 50);
  }

  // ---------------------------------------------------------------- languages
  function catalogueFor(lang) {
    if (S.cats[lang]) return Promise.resolve();
    return call('catalogue', { language: lang }).then(function (r) {
      var g = (r.groups || [])[0]; S.cats[lang] = g ? g.categories : [];
      S.cats[lang].forEach(function (c) { c.blocks.forEach(function (b) { S.byId[b.id] = b; }); });
    });
  }
  function drawLangs() {
    var box = $('langs'); box.innerHTML = '';
    S.langs.forEach(function (l) {
      var b = el('button', 'chip' + (l.id === S.lang ? ' on' : ''), esc(l.name)); b.title = l.about;
      b.onclick = function () { if (l.id !== S.lang) switchTo(l.id); };
      box.appendChild(b);
    });
  }
  function switchTo(lang) {
    return keep().then(function () {
      if (S.drafts[lang]) return load(S.drafts[lang], S.ids[lang]);
      return call('starter', { language: lang }).then(function (r) { return load(r.project || { name: 'untitled', language: lang, blocks: [] }, ''); });
    });
  }

  // ---------------------------------------------------------------- wiring
  $('search').addEventListener('input', function (e) { S.filter = e.target.value; drawPalette(); });
  $('search').addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { var first = document.querySelector('#palette .pal'); if (first) first.click(); }
    if (e.key === 'Escape') { e.target.value = ''; S.filter = ''; drawPalette(); e.target.blur(); }
  });
  $('name').addEventListener('input', function (e) { S.project.name = e.target.value; changed(false); });
  $('name').addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') e.target.blur(); });
  $('undo').onclick = undo; $('redo').onclick = redo;
  $('bExamples').onclick = examples; $('bImport').onclick = importer; $('bProjects').onclick = projects; $('bSave').onclick = saveFile; $('bRun').onclick = runNow;
  $('bIn').onclick = indent; $('bOut').onclick = outdent;
  $('bClear').onclick = function () { if (!blocks().length) return; remember(); S.project.blocks = []; S.sel = ''; changed(true); toast('Cleared - Undo brings it back.'); };
  $('bCopy').onclick = function () {
    var code = (S.built && S.built.code) || '';
    var fallback = function () { var t = el('textarea'); t.value = code; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copying is not allowed here.'); } t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function () { toast('Copied'); }, fallback); else fallback();
  };
  document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { side(b.dataset.t); }; });
  document.querySelectorAll('.nav button').forEach(function (b) { b.onclick = function () { view(b.dataset.v); }; });
  $('sheetClose').onclick = closeSheet;
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey, typing = /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || ''), k = (e.key || '').toLowerCase();
    if (e.key === 'Escape') { if (!$('sheet').hidden) closeSheet(); else { S.sel = ''; markSel(); } return; }
    if (mod && e.key === 'Enter') { e.preventDefault(); runNow(); return; }
    if (mod && k === 's') { e.preventDefault(); saveFile(); return; }
    if (typing || !$('sheet').hidden) return;
    if (mod && !e.shiftKey && k === 'z') { e.preventDefault(); undo(); }
    else if (mod && (k === 'y' || (e.shiftKey && k === 'z'))) { e.preventDefault(); redo(); }
    else if (mod && k === 'd') { e.preventDefault(); duplicate(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); removeSel(); }
    else if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'Tab' && S.sel) { e.preventDefault(); if (e.shiftKey) outdent(); else indent(); }
    else if (e.key === '/') { e.preventDefault(); $('search').focus(); }
  });

  // ---------------------------------------------------------------- start
  call('languages').then(function (r) {
    S.langs = r.languages || [];
    return call('starter');
  }).then(function (s) {
    S.folder = s.folder || '';
    return call('projects').then(function (r) {
      var latest = (r.projects || [])[0];
      if (latest) return call('open_project', { id: latest.id }).then(function (o) { return o.ok ? load(o.project, latest.id) : load(s.project, ''); });
      return load(s.project || { name: 'hello', language: 'python', blocks: [] }, '');
    });
  }).then(function () { if (document.body.clientWidth <= 700) view('script'); });
}());
</script>
</body>
</html>
