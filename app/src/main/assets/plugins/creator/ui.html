<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator</title>
</head>
<body>
<!--
  The panel's own styles come after the app's, so they win where they overlap.
  Every colour here is one of the app's: this is a tab, and a tab that looked
  like somebody else's app would be a worse tab.

  Two rules this panel keeps to, both learned the hard way:

  * **Everything on screen is the real code.** The palette shows the line a
    block writes, filled in; the script shows the line each block wrote, from
    the compiler itself. Showing templates - `print(@text@)` - made a list of
    blocks read as a list of placeholders.
  * **No `alert`, `confirm` or `prompt`.** A WebView with no chrome client
    answers those by ignoring them, and `confirm` then reads as "no" - which
    turns a button into a button that does nothing. Every question this panel
    asks is a sheet of its own.
-->
<style>
  /*
    Nothing here is pinned to the viewport, and that is the point.

    This panel spent three releases being the one that would not scroll. It
    had a sticky bar at the top and a button row fixed to the bottom, and it
    was the only panel that did - the others are plain pages and scroll fine.
    Trying to fix it by making the body its own scroller was worse: percentage
    heights collapse the whole panel to nothing in this WebView.

    So it is a plain page now, like the panels that work. The bar scrolls away
    with everything else, and the buttons that used to be fixed at the bottom
    sit at the top instead - where they are on screen the moment the panel
    opens, without anybody having to scroll to reach them.
  */
  body { margin: 0; padding: 0 0 32px; }

  .bar {
    background: #0B0F14; border-bottom: 1px solid #223041;
    padding: 10px 14px 10px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .field-input {
    font: inherit; padding: 9px 11px; border-radius: 10px;
    border: 1px solid #223041; background: #10161F; color: #F1F5FA; width: 100%;
  }
  select.field-input { font-weight: 600; }
  .muted { color: #8FA0B4; font-size: 12px; }
  .warn { color: #E0A33E; font-size: 12px; }
  .bad { color: #E05A5A; font-size: 13px; }

  .chip {
    display: inline-block; padding: 7px 13px; border-radius: 20px;
    border: 1px solid #223041; background: #121A24; color: #9BA9BB;
    font-size: 13px; white-space: nowrap;
  }
  .chip.on { background: #16324D; border-color: #2E7DD1; color: #DCE3EC; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 3px 0; }
  .chips::-webkit-scrollbar { height: 0; }

  button.small {
    font: inherit; padding: 9px 13px; font-size: 13px; border-radius: 10px;
    background: #121A24; border: 1px solid #223041; color: #DCE3EC;
  }
  button.small.primary { background: #16324D; border-color: #2E7DD1; }
  button.small.danger { border-color: #5A2A2A; color: #F0A5A5; }
  button.small:disabled { opacity: .45; }

  .pane { padding: 12px 14px 0; }
  .head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 18px 0 6px; color: #F1F5FA; font-weight: 600; font-size: 15px;
  }
  .head .muted { font-weight: 400; }

  .note {
    background: #121A24; border: 1px solid #223041; border-radius: 10px;
    padding: 9px 11px; margin: 6px 0 10px; font-size: 12px; color: #9BA9BB;
  }
  .note b { color: #DCE3EC; font-weight: 600; }

  /* -- the script ---------------------------------------------------- */
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; color: #DCE3EC; white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .blk {
    border: 1px solid #223041; border-left: 3px solid #2E7DD1;
    background: #121A24; border-radius: 10px;
    padding: 9px 11px; margin: 6px 0;
  }
  .blk.sel { border-color: #2E7DD1; background: #16243A; }
  .blk .why { font-size: 12px; color: #8FA0B4; margin-top: 3px; }
  .blk.holds .why::after { content: "  ·  holds blocks"; color: #6FB3FF; }
  .blk.cat-Logic, .blk.cat-Loops { border-left-color: #E0A33E; }
  .blk.cat-Functions, .blk.cat-Classes { border-left-color: #9B6FE0; }
  .blk.cat-Text, .blk.cat-Lists, .blk.cat-Dictionaries { border-left-color: #43B581; }
  .blk.cat-Errors { border-left-color: #E05A5A; }
  .rail { border-left: 1px dashed #223041; margin-left: 9px; padding-left: 13px; }
  .closing { font-size: 12px; color: #55657A; margin: 2px 0 6px 6px; }

  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .tools button { padding: 8px 11px; font-size: 12px; }

  /* -- the palette, which lives in its own sheet ---------------------- */
  .addtop {
    position: sticky; top: 0; z-index: 2;
    background: #0B0F14; padding: 12px 0 10px;
    border-bottom: 1px solid #223041; margin-bottom: 8px;
  }
  .pal { padding-bottom: 8px; }
  .pick {
    display: block; width: 100%; text-align: left;
    border: 1px solid #223041; background: #10161F; color: #DCE3EC;
    border-radius: 10px; padding: 10px 12px; margin: 6px 0; font: inherit;
  }
  .pick .what { font-size: 14px; color: #F1F5FA; }
  .pick .code { color: #6FB3FF; font-size: 12px; margin-top: 3px; display: block; }
  /* The heading over each group of blocks. Sticky, because a list of two
     hundred is scrolled a long way and "which group am I in" is the question
     it raises. */
  .palgroup {
    position: sticky; top: 0; z-index: 1;
    background: #0B0F14; color: #8FA3BC;
    font-size: 11.5px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 10px 2px 4px;
  }
  .palgroup:first-child { padding-top: 2px; }

  /* -- overlays ------------------------------------------------------ */
  /*
    A sheet covers the whole panel and scrolls inside itself - which is the
    one arrangement in this panel that has always worked on a phone, and the
    reason the block picker is a sheet rather than a section of the page.
    Closed, it is `display: none` and costs the layout nothing.
  */
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(4, 8, 12, .86);
    display: none; z-index: 20;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 22px 12px 40px;
  }
  .sheet.open { display: block; }
  #addSheet { background: #0B0F14; padding-top: 0; }
  .sheet .card { max-width: 640px; margin: 0 auto; }
  .field { margin: 12px 0; }
  .field label { display: block; font-size: 12px; color: #8FA0B4; margin-bottom: 5px; }

  /* What used to be the fixed footer, now the first thing under the bar. */
  .actions {
    background: #0B0F14; border-bottom: 1px solid #223041;
    padding: 10px 14px 12px;
    display: flex; gap: 8px;
  }
  .actions button { flex: 1 1 0; padding: 13px 8px; font-size: 14px; }
  .empty {
    color: #8FA0B4; font-size: 13px; padding: 16px 12px;
    border: 1px dashed #223041; border-radius: 10px; text-align: center;
  }
  pre.out { max-height: 50vh; overflow: auto; }
</style>

<div class="bar">
  <div class="row">
    <input id="name" class="field-input grow" value="hello" aria-label="Project name">
    <button class="small" id="new">New</button>
    <button class="small" id="drawer">Saved</button>
  </div>
  <div class="row" style="margin-top:8px">
    <select id="lang" class="field-input grow" aria-label="Language"></select>
    <button class="small" id="example-load" title="Fill this language's script with a working example">Example</button>
  </div>
  <div class="muted" id="about" style="margin-top:7px">&nbsp;</div>
  <div class="muted" id="count" style="margin-top:4px">&nbsp;</div>
</div>

<div class="actions">
  <button class="small primary" id="openAdd" style="flex:2 1 0">+ Add a block</button>
  <button class="small" id="build">Code</button>
  <button class="small" id="save">Save</button>
</div>

<div class="pane">
  <div id="trouble"></div>

  <div class="head">Your script <span class="muted" id="hint"></span></div>
  <div class="note" id="example" style="display:none">
    This is an <b>example</b> to start from. Change it, or press <b>New</b> for an
    empty one.
  </div>
  <div id="script"></div>
</div>

<!--
  Adding a block is a screen of its own.

  It used to be a section at the bottom of the same page, under the script -
  which meant the search box, the categories and the results were all below
  the fold on a phone, behind the button bar. Searching worked and the count
  changed; the nine matching blocks were simply somewhere nobody could see.
  A list you scroll to find is a list that is not there.
-->
<div class="sheet" id="addSheet">
  <div class="card">
    <div class="addtop">
      <div class="row">
        <h2 class="grow" style="margin:0">Add a block</h2>
        <button class="small primary" id="addDone">Done</button>
      </div>
      <div class="note" id="where">Blocks land at the end of the script.</div>
      <input id="search" class="field-input" placeholder="Search - print, loop, colour"
             aria-label="Search blocks">
      <div class="chips" id="cats" style="margin-top:8px"></div>
      <div class="muted" id="palcount" style="margin-top:6px">&nbsp;</div>
      <div class="muted" id="added" style="margin-top:4px"></div>
    </div>
    <div class="pal" id="palette"></div>
  </div>
</div>

<div class="sheet" id="editSheet">
  <div class="card">
    <h2 id="editTitle">Fill it in</h2>
    <div class="code" id="editPreview" style="margin-bottom:8px"></div>
    <div id="editFields"></div>
    <div class="row" style="margin-top:16px">
      <button class="small primary grow" id="editOk">Done</button>
      <button class="small" id="editCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="sheet" id="codeSheet">
  <div class="card">
    <h2 id="codeTitle">The code</h2>
    <pre class="out"><code class="code" id="codeOut"></code></pre>
    <div id="codeProblems" class="warn"></div>
    <div class="row" style="margin-top:16px">
      <button class="small primary grow" id="codeSave">Save as a file</button>
      <button class="small" id="codeClose">Close</button>
    </div>
  </div>
</div>

<div class="sheet" id="saveSheet">
  <div class="card">
    <h2>Save it into the workspace</h2>
    <div class="field">
      <label for="saveName">File name</label>
      <input id="saveName" class="field-input">
    </div>
    <div class="field">
      <label for="saveFolder">Folder inside the workspace (blank means the top)</label>
      <input id="saveFolder" class="field-input" placeholder="sites/blog">
    </div>
    <div class="row" style="margin-top:16px">
      <button class="small primary grow" id="saveOk">Save</button>
      <button class="small" id="saveCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="sheet" id="drawerSheet">
  <div class="card">
    <h2>Saved projects</h2>
    <div id="drawerList"></div>
    <div class="row" style="margin-top:16px">
      <button class="small primary grow" id="drawerKeep">Keep this one</button>
      <button class="small" id="drawerClose">Close</button>
    </div>
  </div>
</div>

<div class="sheet" id="askSheet">
  <div class="card">
    <h2 id="askTitle">Are you sure?</h2>
    <div class="muted" id="askBody"></div>
    <div class="row" style="margin-top:16px">
      <button class="small danger grow" id="askOk">Yes</button>
      <button class="small" id="askNo">No</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- state
  //
  // One draft per language, so picking a different language is picking a
  // different script rather than throwing the current one away. That is what
  // the language chooser used to do, behind a `confirm()` that a WebView with
  // no chrome client answers by ignoring - which made switching look broken.

  var state = {
    language: 'python',
    drafts: {},        // language -> { name, blocks, file }
    ids: {},           // language -> id in the saved drawer, '' until saved
    catalogues: {},    // language -> { categories: [...] }
    byId: {},          // block id -> definition, for the current language
    languages: [],
    category: '',
    search: '',
    selected: null,    // a path into the tree, e.g. [0, 2, 1]
    untouched: true,   // still showing the example it opened with
    startedIn: '',     // the language that example was in
    outline: {},       // a node's uid -> the line it wrote
    closings: {},      // a node's uid -> the line that closes it
    uid: 0,            // handed out to every node, so a moved block keeps its line
    building: null,
    folder: ''
  };

  var $ = function (id) { return document.getElementById(id); };

  function escapeHtml(text) {
    return String(text === undefined || text === null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /** The same, plus the quotes - this goes inside an attribute. */
  function escapeAttr(text) {
    return escapeHtml(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /**
   * A name for a node that survives being moved.
   *
   * The compiler answers with one line per block, and the script view has to
   * know which block each line belongs to. A path is the obvious key and the
   * wrong one: delete the first block and every path below it changes, so the
   * lines would sit under the wrong blocks until the next build came back.
   */
  function nextUid() {
    state.uid += 1;
    return 'n' + state.uid;
  }

  /**
   * Names every node in a tree that has just arrived from storage.
   *
   * Always a fresh name, never the one that was saved: the counter starts at
   * zero each time the panel opens, so keeping a stored `n3` would mean the
   * third block added afterwards was also `n3`, and two blocks sharing a name
   * share a line.
   */
  function stampUids(nodes) {
    (nodes || []).forEach(function (node) {
      node.uid = nextUid();
      stampUids(node.children);
    });
  }

  function freshUids(node) {
    node.uid = nextUid();
    (node.children || []).forEach(freshUids);
    return node;
  }

  function draft() {
    if (!state.drafts[state.language]) {
      state.drafts[state.language] = { name: 'untitled', blocks: [], file: '' };
    }
    return state.drafts[state.language];
  }

  function project() {
    var current = draft();
    return {
      name: current.name,
      language: state.language,
      blocks: current.blocks,
      file: current.file || ''
    };
  }

  /** Anything that went wrong is said on the page, not only in a toast. */
  function trouble(message) {
    var host = $('trouble');
    host.innerHTML = '';
    if (!message) return;
    var card = document.createElement('div');
    card.className = 'note bad';
    card.textContent = message;
    host.appendChild(card);
  }

  function ask(title, body, yes) {
    $('askTitle').textContent = title;
    $('askBody').textContent = body;
    state.askYes = yes;
    $('askSheet').classList.add('open');
  }

  // ------------------------------------------------------------ the tree

  function listAt(path) {
    var list = draft().blocks;
    for (var i = 0; i < path.length - 1; i++) {
      var node = list[path[i]];
      if (!node) return null;
      node.children = node.children || [];
      list = node.children;
    }
    return list;
  }

  function nodeAt(path) {
    if (!path) return null;
    var list = listAt(path);
    return list ? list[path[path.length - 1]] : null;
  }

  function samePath(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }

  function insertAfter(path, node) {
    if (!path) {
      draft().blocks.push(node);
      return [draft().blocks.length - 1];
    }
    var list = listAt(path);
    var at = path[path.length - 1] + 1;
    list.splice(at, 0, node);
    var next = path.slice();
    next[next.length - 1] = at;
    return next;
  }

  function removeAt(path) {
    var list = listAt(path);
    if (list) list.splice(path[path.length - 1], 1);
  }

  function move(path, delta) {
    var list = listAt(path);
    var from = path[path.length - 1];
    var to = from + delta;
    if (to < 0 || to >= list.length) return path;
    list.splice(to, 0, list.splice(from, 1)[0]);
    var next = path.slice();
    next[next.length - 1] = to;
    return next;
  }

  function indent(path) {
    var list = listAt(path);
    var at = path[path.length - 1];
    if (at === 0) { pycmd.toast('There is no block above this one to go inside.'); return path; }
    var above = list[at - 1];
    var spec = state.byId[above.block];
    if (!spec || !spec.wrap) {
      pycmd.toast('"' + (spec ? spec.label : 'That block') + '" cannot hold blocks.');
      return path;
    }
    above.children = above.children || [];
    var node = list.splice(at, 1)[0];
    above.children.push(node);
    return path.slice(0, -1).concat([at - 1, above.children.length - 1]);
  }

  function outdent(path) {
    if (path.length < 2) { pycmd.toast('This block is already at the top level.'); return path; }
    var list = listAt(path);
    var node = list.splice(path[path.length - 1], 1)[0];
    var parentPath = path.slice(0, -1);
    var parentList = listAt(parentPath);
    var at = parentPath[parentPath.length - 1] + 1;
    parentList.splice(at, 0, node);
    var next = parentPath.slice();
    next[next.length - 1] = at;
    return next;
  }

  function countBlocks(nodes) {
    var total = 0;
    (nodes || []).forEach(function (node) { total += 1 + countBlocks(node.children); });
    return total;
  }

  // -------------------------------------------------------------- drawing

  function defaultsFor(spec) {
    var values = {};
    (spec.slots || []).forEach(function (slot) { values[slot.name] = slot.default; });
    return values;
  }

  /**
   * The line a block writes.
   *
   * From the compiler when it has answered, and from the block's own filled-in
   * preview until then - so the first paint says something true rather than
   * nothing, and the next one says it exactly.
   */
  function fill(template, node, spec) {
    var text = template || '';
    (spec.slots || []).forEach(function (slot) {
      var value = node.values && node.values[slot.name] !== undefined
        ? node.values[slot.name] : slot.default;
      text = text.split('@' + slot.name + '@').join(String(value === undefined ? '' : value));
    });
    return text.split('@@').join('@');
  }

  function lineFor(path, node, spec) {
    var known = state.outline[node.uid];
    if (known !== undefined) return known;
    if (!spec) return 'unknown block: ' + node.block;
    return fill(spec.open, node, spec) || '(an empty line)';
  }

  /** The line that closes a container - `}`, `</div>`, `}, 500);`. */
  function closingFor(node, spec) {
    var known = state.closings[node.uid];
    if (known !== undefined) return known;
    if (!spec || !spec.close) return '';
    return fill(spec.close, node, spec);
  }

  function refresh() {
    // Anything that edits the script means it is not the example any more.
    state.untouched = false;
    drawScript();
    scheduleBuild();
  }

  function drawScript() {
    var host = $('script');
    host.innerHTML = '';
    state.selectedEl = null;
    var blocks = draft().blocks;
    if (!blocks.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing here yet. Press "+ Add a block" and pick one.';
      host.appendChild(empty);
    } else {
      host.appendChild(drawStack(blocks, []));
    }

    var total = countBlocks(blocks);
    var meta = languageRow(state.language);
    $('count').textContent = total + ' block' + (total === 1 ? '' : 's') + '  ·  ' +
      (meta ? meta.name : state.language) + '  ·  ' + (meta ? meta.extension : '');
    $('example').style.display =
      (state.untouched && state.language === state.startedIn && blocks.length) ? '' : 'none';
    drawWhere();
  }

  /**
   * Where the next block will land, said in both places it matters: under the
   * script's heading, and at the top of the sheet you add from.
   */
  function drawWhere() {
    var target = state.selected ? nodeAt(state.selected) : null;
    var spec = target ? state.byId[target.block] : null;
    var name = escapeHtml(spec ? spec.label : 'the selected block');
    var long;
    var short;
    if (!target) {
      long = 'The next block goes <b>at the end</b> of the script. Tap a block ' +
        'in the script to put it somewhere else.';
      short = 'new blocks go at the end';
    } else if (spec && spec.wrap) {
      long = 'The next block goes <b>inside</b> "' + name + '".';
      short = 'new blocks go inside "' + (spec ? spec.label : '') + '"';
    } else {
      long = 'The next block goes <b>after</b> "' + name + '".';
      short = 'new blocks go after "' + (spec ? spec.label : '') + '"';
    }
    $('where').innerHTML = long;
    $('hint').textContent = short;
  }

  function drawStack(nodes, base) {
    var wrap = document.createElement('div');
    nodes.forEach(function (node, index) {
      var path = base.concat([index]);
      var spec = state.byId[node.block];
      var element = document.createElement('div');
      element.className = 'blk' + (samePath(path, state.selected) ? ' sel' : '') +
        (spec && spec.wrap ? ' holds' : '');
      if (spec) element.className += ' cat-' + String(spec.cat).replace(/[^A-Za-z]/g, '');

      var code = document.createElement('div');
      code.className = 'code';
      code.textContent = lineFor(path, node, spec);
      element.appendChild(code);

      var why = document.createElement('div');
      why.className = 'why';
      why.textContent = spec ? spec.label : 'this block is not in this language';
      element.appendChild(why);

      element.addEventListener('click', function (event) {
        event.stopPropagation();
        state.selected = samePath(path, state.selected) ? null : path;
        drawScript();
      });

      if (samePath(path, state.selected)) {
        state.selectedEl = element;
        element.appendChild(drawTools(path, spec));
      }
      wrap.appendChild(element);

      if (spec && spec.wrap) {
        node.children = node.children || [];
        if (node.children.length) {
          var rail = document.createElement('div');
          rail.className = 'rail';
          rail.appendChild(drawStack(node.children, path));
          wrap.appendChild(rail);
        }
        var closingText = closingFor(node, spec);
        if (closingText) {
          var closing = document.createElement('div');
          closing.className = 'closing code';
          closing.textContent = closingText;
          wrap.appendChild(closing);
        }
      }
    });
    return wrap;
  }

  function tool(label, action) {
    var button = document.createElement('button');
    button.className = 'small';
    button.textContent = label;
    button.addEventListener('click', function (event) {
      event.stopPropagation();
      action();
    });
    return button;
  }

  function drawTools(path, spec) {
    var row = document.createElement('div');
    row.className = 'tools';
    if (spec && spec.slots.length) {
      row.appendChild(tool('Fill in', function () { openEditor(path); }));
    }
    row.appendChild(tool('Up', function () { state.selected = move(path, -1); refresh(); }));
    row.appendChild(tool('Down', function () { state.selected = move(path, 1); refresh(); }));
    row.appendChild(tool('Move inside', function () { state.selected = indent(path); refresh(); }));
    row.appendChild(tool('Move out', function () { state.selected = outdent(path); refresh(); }));
    row.appendChild(tool('Duplicate', function () {
      // A copy is a different block, so it gets its own name - two blocks
      // sharing one would share a line as well.
      var copy = freshUids(JSON.parse(JSON.stringify(nodeAt(path))));
      state.selected = insertAfter(path, copy);
      refresh();
    }));
    var drop = tool('Delete', function () {
      removeAt(path);
      state.selected = null;
      refresh();
    });
    drop.className = 'small danger';
    row.appendChild(drop);
    return row;
  }

  // -------------------------------------------------------------- palette

  function drawCategories() {
    var host = $('cats');
    host.innerHTML = '';
    var groups = (state.catalogues[state.language] || { categories: [] }).categories || [];
    var all = document.createElement('span');
    all.className = 'chip' + (state.category === '' ? ' on' : '');
    all.textContent = 'Everything';
    all.addEventListener('click', function () {
      state.category = ''; drawCategories(); drawPalette();
    });
    host.appendChild(all);
    groups.forEach(function (group) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (state.category === group.name ? ' on' : '');
      chip.textContent = group.name;
      chip.addEventListener('click', function () {
        state.category = group.name; drawCategories(); drawPalette();
      });
      host.appendChild(chip);
    });
  }

  /**
   * Redraws the block list for the current language, category and search.
   *
   * One string, one write, and one click listener on the container rather
   * than a listener per block: a hundred and fifty separate `appendChild`
   * calls each carrying a closure is a visible pause on a phone, and this
   * runs on every letter typed into the search box.
   */
  function drawPalette() {
    var host = $('palette');
    var groups = (state.catalogues[state.language] || { categories: [] }).categories || [];
    var needle = state.search.trim().toLowerCase();
    var parts = [];
    var shown = 0;

    groups.forEach(function (group) {
      if (state.category && group.name !== state.category) return;
      var here = 0;
      var mark = parts.length;
      // A heading per group, written before its blocks and taken back out
      // again if the search left none of them. Twenty-one groups of Python
      // blocks in one flat list is a wall; the same list with its headings
      // in it can be scanned.
      parts.push('<div class="palgroup">' + escapeHtml(group.name) + '</div>');
      group.blocks.forEach(function (spec) {
        if (needle && (spec.hay || '').indexOf(needle) < 0) return;
        shown += 1;
        here += 1;
        parts.push(
          '<button class="pick" type="button" data-block="' +
          escapeAttr(spec.id) + '">' +
          '<span class="what">' + escapeHtml(spec.label) + '</span>' +
          '<span class="code">' + escapeHtml(spec.preview || '(an empty line)') +
          (spec.closing ? '  …  ' + escapeHtml(spec.closing) : '') + '</span>' +
          '</button>'
        );
      });
      if (!here) parts.splice(mark, 1);
    });

    if (!shown) {
      parts.push('<div class="empty">' + escapeHtml(needle
        ? 'No block matches "' + needle + '".'
        : 'No blocks loaded for this language yet.') + '</div>');
    }
    host.innerHTML = parts.join('');
    var total = (state.catalogues[state.language] || {}).count || 0;
    $('palcount').textContent = shown + ' of ' + total;
  }

  /** Opens the block picker, with the list already drawn and nothing typed. */
  function openAdd() {
    $('added').textContent = '';
    // The category is worth keeping between visits; a search is not - coming
    // back to a list still filtered by what you looked for last time reads as
    // a list with most of the blocks missing.
    state.search = '';
    $('search').value = '';
    drawWhere();
    drawCategories();
    drawPalette();
    $('addSheet').classList.add('open');
  }

  function add(spec) {
    var node = { block: spec.id, uid: nextUid(), values: defaultsFor(spec) };
    if (spec.wrap) node.children = [];

    var target = state.selected ? nodeAt(state.selected) : null;
    var targetSpec = target ? state.byId[target.block] : null;
    if (target && targetSpec && targetSpec.wrap) {
      target.children = target.children || [];
      target.children.push(node);
      state.selected = state.selected.concat([target.children.length - 1]);
    } else {
      state.selected = insertAfter(state.selected, node);
    }
    refresh();

    // The sheet stays open, so several blocks can go on in a row - but it has
    // to say that something happened, or tapping feels like nothing at all.
    $('added').textContent = 'Added "' + spec.label + '"  ·  ' +
      countBlocks(draft().blocks) + ' blocks now';
  }

  // --------------------------------------------------------- the editor

  var editing = null;

  function openEditor(path) {
    var node = nodeAt(path);
    var spec = node && state.byId[node.block];
    if (!spec) return;
    editing = path;
    $('editTitle').textContent = spec.label;
    $('editPreview').textContent = lineFor(path, node, spec);

    var host = $('editFields');
    host.innerHTML = '';
    spec.slots.forEach(function (slot) {
      var field = document.createElement('div');
      field.className = 'field';
      var label = document.createElement('label');
      label.textContent = slot.label;
      label.setAttribute('for', 'slot-' + slot.name);
      field.appendChild(label);

      var current = node.values && node.values[slot.name] !== undefined
        ? node.values[slot.name] : slot.default;
      var input;
      if (slot.kind === 'choice') {
        input = document.createElement('select');
        (slot.options || []).forEach(function (option) {
          var item = document.createElement('option');
          item.value = option;
          item.textContent = option;
          if (String(current) === option) item.selected = true;
          input.appendChild(item);
        });
      } else {
        input = document.createElement('input');
        input.type = slot.kind === 'number' ? 'number' : 'text';
        input.value = current === undefined ? '' : current;
        input.autocapitalize = 'none';
        input.autocomplete = 'off';
        input.spellcheck = false;
      }
      input.className = 'field-input';
      input.id = 'slot-' + slot.name;
      input.setAttribute('data-slot', slot.name);
      field.appendChild(input);
      host.appendChild(field);
    });

    $('editSheet').classList.add('open');
  }

  function closeEditor(keep) {
    if (keep && editing) {
      var node = nodeAt(editing);
      if (node) {
        node.values = node.values || {};
        var fields = $('editFields').querySelectorAll('[data-slot]');
        for (var i = 0; i < fields.length; i++) {
          node.values[fields[i].getAttribute('data-slot')] = fields[i].value;
        }
      }
    }
    editing = null;
    $('editSheet').classList.remove('open');
    refresh();
  }

  // ----------------------------------------------------- build and save

  /**
   * Asks the compiler what the script writes, and keeps the answer.
   *
   * Debounced, because it runs after every edit: the answer is what the
   * script view shows, so it has to be current, and one call per keystroke
   * would be one bridge round trip per keystroke.
   */
  function scheduleBuild() {
    if (state.building) clearTimeout(state.building);
    state.building = setTimeout(function () {
      state.building = null;
      pycmd.call('build', { project: project() }).then(function (result) {
        if (!result || !result.ok) return;
        var lines = {};
        var closes = {};
        (result.outline || []).forEach(function (entry) {
          if (!entry.uid) return;
          if (entry.role === 'open') lines[entry.uid] = entry.text;
          if (entry.role === 'close') closes[entry.uid] = entry.text;
        });
        state.outline = lines;
        state.closings = closes;
        drawScript();
      }).catch(function (error) {
        trouble('The compiler did not answer: ' + (error.message || error));
      });
    }, 140);
  }

  function showCode() {
    pycmd.call('build', { project: project() }).then(function (result) {
      if (!result || !result.ok) {
        trouble((result && result.error) || 'That did not build.');
        return;
      }
      $('codeOut').textContent = result.code || '(nothing yet - add some blocks)';
      $('codeTitle').textContent = result.lines + ' line' +
        (result.lines === 1 ? '' : 's') + ' of ' + result.language;
      $('codeProblems').textContent = (result.problems || []).join('  ·  ');
      $('codeSheet').classList.add('open');
    }).catch(function (error) {
      trouble('That did not build: ' + (error.message || error));
    });
  }

  function openSave() {
    var meta = languageRow(state.language);
    var name = draft().name || 'untitled';
    $('saveName').value = name.indexOf('.') >= 0
      ? name
      : name + ((meta && meta.extension) || '.txt');
    $('saveFolder').value = state.folder || '';
    $('saveSheet').classList.add('open');
  }

  function doSave() {
    var name = $('saveName').value;
    var folder = $('saveFolder').value;
    state.folder = folder;
    $('saveSheet').classList.remove('open');
    pycmd.call('save_file', { project: project(), name: name, folder: folder })
      .then(function (result) {
        if (!result || !result.ok) {
          trouble((result && result.error) || 'That did not save.');
          return;
        }
        trouble('');
        draft().file = result.path;
        pycmd.toast('Saved ' + result.path);
        keepProject();
      }).catch(function (error) {
        trouble('That did not save: ' + (error.message || error));
      });
  }

  function keepProject() {
    return pycmd.call('save_project', { id: state.ids[state.language] || '', project: project() })
      .then(function (result) {
        if (result && result.ok) state.ids[state.language] = result.id;
        return result;
      }).catch(function (error) {
        trouble('That project was not kept: ' + (error.message || error));
      });
  }

  // ------------------------------------------------------------- drawer

  function openDrawer() {
    pycmd.call('projects', {}).then(function (result) {
      var host = $('drawerList');
      host.innerHTML = '';
      var rows = (result && result.projects) || [];
      if (!rows.length) {
        var none = document.createElement('div');
        none.className = 'empty';
        none.textContent = 'Nothing kept yet. "Keep this one" puts the script you are on in here.';
        host.appendChild(none);
      }
      rows.forEach(function (row) {
        var line = document.createElement('div');
        line.className = 'row';
        line.style.margin = '8px 0';

        var open = document.createElement('button');
        open.className = 'small grow';
        open.style.textAlign = 'left';
        open.innerHTML = '<span class="what">' + escapeHtml(row.name) + '</span>' +
          '<span class="code">' + escapeHtml(row.language) + '  ·  ' +
          row.blocks + ' blocks</span>';
        open.addEventListener('click', function () { loadProject(row.id); });

        var drop = document.createElement('button');
        drop.className = 'small danger';
        drop.textContent = 'Delete';
        drop.addEventListener('click', function () {
          pycmd.call('delete_project', { id: row.id }).then(function () {
            Object.keys(state.ids).forEach(function (key) {
              if (state.ids[key] === row.id) state.ids[key] = '';
            });
            openDrawer();
          });
        });

        line.appendChild(open);
        line.appendChild(drop);
        host.appendChild(line);
      });
      $('drawerSheet').classList.add('open');
    }).catch(function (error) {
      trouble('The saved projects could not be read: ' + (error.message || error));
    });
  }

  function loadProject(id) {
    pycmd.call('open_project', { id: id }).then(function (result) {
      if (!result || !result.ok) { trouble('That project is gone.'); return; }
      var loaded = result.project;
      state.language = loaded.language;
      state.drafts[loaded.language] = {
        name: loaded.name,
        blocks: loaded.blocks || [],
        file: loaded.file || ''
      };
      stampUids(state.drafts[loaded.language].blocks);
      state.ids[loaded.language] = result.id;
      state.selected = null;
      state.category = '';
      $('name').value = loaded.name;
      $('lang').value = loaded.language;
      $('drawerSheet').classList.remove('open');
      useLanguage(loaded.language);
    });
  }

  // ---------------------------------------------------------- languages

  function languageRow(id) {
    for (var i = 0; i < state.languages.length; i++) {
      if (state.languages[i].id === id) return state.languages[i];
    }
    return null;
  }

  function drawLanguages() {
    var host = $('lang');
    host.innerHTML = '';
    state.languages.forEach(function (row) {
      var option = document.createElement('option');
      option.value = row.id;
      option.textContent = row.name + '  -  ' + row.blocks + ' blocks' +
        (row.runs ? '  -  runs here' : '');
      if (row.id === state.language) option.selected = true;
      host.appendChild(option);
    });
  }

  /*
   * What the chosen language is, in a sentence.
   *
   * With five languages a name was enough. With ten - four of which most
   * people have never written a line of - the difference between "runs on
   * this phone" and "is a file you serve" is the first thing worth knowing,
   * so it is on screen rather than in a guide.
   */
  function drawAbout() {
    var row = null;
    state.languages.forEach(function (each) {
      if (each.id === state.language) row = each;
    });
    if (!row) { $('about').textContent = ''; return; }
    $('about').textContent = row.about +
      (row.runs ? '  Press Run on the saved file and it runs on this phone.' : '');
  }

  /** Switches to a language and makes sure its blocks are loaded. */
  function useLanguage(id) {
    state.language = id;
    state.selected = null;
    state.category = '';
    $('name').value = draft().name;
    state.outline = {};
    state.closings = {};
    var wasUntouched = state.untouched;
    drawAbout();
    return loadCatalogue(id).then(function () {
      drawCategories();
      drawPalette();
      refresh();
      state.untouched = wasUntouched;
      drawScript();
    });
  }

  function loadCatalogue(language) {
    if (state.catalogues[language]) {
      indexBlocks(language);
      return Promise.resolve(state.catalogues[language]);
    }
    return pycmd.call('catalogue', { language: language }).then(function (result) {
      if (!result || !result.ok) {
        trouble('The blocks for ' + language + ' did not load: ' +
                ((result && result.error) || 'no answer'));
        return null;
      }
      var group = (result.groups || [])[0];
      if (!group) {
        trouble('The blocks for ' + language + ' came back empty.');
        return null;
      }
      state.catalogues[language] = group;
      indexBlocks(language);
      trouble('');
      return group;
    }).catch(function (error) {
      trouble('The blocks for ' + language + ' did not load: ' +
              (error.message || error));
      return null;
    });
  }

  function indexBlocks(language) {
    state.byId = {};
    var group = state.catalogues[language];
    if (!group) return;
    (group.categories || []).forEach(function (category) {
      category.blocks.forEach(function (spec) {
        state.byId[spec.id] = spec;
        // Built once here rather than for every block on every keystroke.
        // A hundred and fifty blocks joined and lower-cased between one
        // letter and the next is how a search box comes to feel stuck.
        if (spec.hay === undefined) {
          spec.hay = (spec.label + ' ' + spec.preview + ' ' + spec.cat).toLowerCase();
        }
      });
    });
  }

  // --------------------------------------------------------------- wiring

  $('name').addEventListener('input', function () { draft().name = $('name').value; });
  $('search').addEventListener('input', function () {
    state.search = $('search').value;
    drawPalette();
  });
  // One listener for every block in the list. The rows are rewritten on each
  // keystroke, so a listener per row would be a hundred and fifty of them
  // created and thrown away per letter.
  $('palette').addEventListener('click', function (event) {
    // The tap usually lands on one of the two spans inside the row, so walk
    // up until something says which block it is.
    var node = event.target;
    var id = null;
    while (node && node.getAttribute) {
      id = node.getAttribute('data-block');
      if (id) break;
      node = node.parentNode;
    }
    var spec = id && state.byId[id];
    if (spec) add(spec);
  });
  $('lang').addEventListener('change', function () { useLanguage($('lang').value); });
  $('openAdd').addEventListener('click', openAdd);
  $('addDone').addEventListener('click', function () {
    $('addSheet').classList.remove('open');
    // Land on what was just added, rather than wherever the script was
    // scrolled to before the sheet opened.
    var chosen = state.selectedEl;
    if (chosen && typeof chosen.scrollIntoView === 'function') {
      chosen.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  $('build').addEventListener('click', showCode);
  $('save').addEventListener('click', openSave);
  $('drawer').addEventListener('click', openDrawer);
  $('drawerKeep').addEventListener('click', function () {
    keepProject().then(function () { pycmd.toast('Kept'); openDrawer(); });
  });
  $('new').addEventListener('click', function () {
    if (!draft().blocks.length) { pycmd.toast('This one is already empty.'); return; }
    ask('Start again?', 'The blocks in this ' + state.language +
        ' script go. Anything you saved as a file, or kept in Saved, stays.',
        function () {
          state.ids[state.language] = '';
          state.drafts[state.language] = { name: 'untitled', blocks: [], file: '' };
          state.selected = null;
          $('name').value = 'untitled';
          refresh();
        });
  });

  /*
   * Every language gets an example, and this is the way back to it.
   *
   * The starter used to arrive once, at boot, in whichever language the
   * setting named - so anybody who switched to Rust got an empty script and
   * a hundred and two blocks with no idea which two go at the top. An empty
   * page is the worst place to start learning a language, and it is exactly
   * where switching left you.
   */
  $('example-load').addEventListener('click', function () {
    var language = state.language;
    var apply = function () {
      pycmd.call('starter', { language: language }).then(function (result) {
        if (!result || !result.ok || !result.project) {
          pycmd.toast('There is no example for ' + language + ' yet.');
          return;
        }
        var start = JSON.parse(JSON.stringify(result.project));
        if (start.language !== language) {
          pycmd.toast('There is no example for ' + language + ' yet.');
          return;
        }
        state.ids[language] = '';
        state.drafts[language] = { name: start.name, blocks: start.blocks, file: '' };
        stampUids(state.drafts[language].blocks);
        state.selected = null;
        $('name').value = start.name;
        refresh();
        state.untouched = true;
        drawScript();
        pycmd.toast('An example ' + language + ' script, ready to change.');
      }).catch(function (error) {
        trouble('The example did not load: ' + (error.message || error));
      });
    };
    if (draft().blocks.length) {
      ask('Replace this script?', 'The blocks in this ' + language +
          ' script go, and an example takes their place.', apply);
    } else {
      apply();
    }
  });

  $('askOk').addEventListener('click', function () {
    $('askSheet').classList.remove('open');
    var yes = state.askYes;
    state.askYes = null;
    if (yes) yes();
  });
  $('askNo').addEventListener('click', function () {
    $('askSheet').classList.remove('open');
    state.askYes = null;
  });

  $('editOk').addEventListener('click', function () { closeEditor(true); });
  $('editCancel').addEventListener('click', function () { closeEditor(false); });
  $('codeClose').addEventListener('click', function () {
    $('codeSheet').classList.remove('open');
  });
  $('codeSave').addEventListener('click', function () {
    $('codeSheet').classList.remove('open');
    openSave();
  });
  $('saveOk').addEventListener('click', doSave);
  $('saveCancel').addEventListener('click', function () {
    $('saveSheet').classList.remove('open');
  });
  $('drawerClose').addEventListener('click', function () {
    $('drawerSheet').classList.remove('open');
  });

  // ----------------------------------------------------------- first draw

  pycmd.call('languages', {}).then(function (result) {
    state.languages = (result && result.languages) || [];
    if (!state.languages.length) {
      trouble('Creator could not read its own languages. Switch the plugin off and on again.');
    }
    return pycmd.call('starter', {});
  }).then(function (result) {
    if (result && result.ok && result.project) {
      var start = JSON.parse(JSON.stringify(result.project));
      state.language = start.language;
      state.drafts[start.language] = {
        name: start.name, blocks: start.blocks, file: ''
      };
      stampUids(state.drafts[start.language].blocks);
      state.folder = result.folder || '';
      state.startedIn = start.language;
    }
    drawLanguages();
    return useLanguage(state.language).then(function () { state.untouched = true; });
  }).catch(function (error) {
    trouble('Creator could not start: ' + (error.message || error));
  });

  // The panel is driven from the test suite as well as by hand; this is the
  // door it comes through, and nothing else uses it.
  window.__creator = state;
})();
</script>
</body>
</html>
