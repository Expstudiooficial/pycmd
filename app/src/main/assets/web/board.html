<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Notes</title>
<style>
  /* The built-in Notes board, shared by the phone (a full-screen WebView) and
     the PC (an iframe). It talks to the app through window.PyBoard.call(). */
  :root {
    --b-bg: var(--bg, #0b0f0c); --b-fg: var(--fg, #e6ede7); --b-surface: var(--surface, #121915);
    --b-high: var(--surface-high, #1a231e); --b-line: var(--outline, #26332b); --b-muted: var(--muted, #8b9a90);
    --b-accent: var(--accent, #5fd38d); --b-soft: var(--accent-soft, rgba(95, 211, 141, .14));
    --b-on: var(--on-accent, #04140a); --b-danger: var(--danger, #e8635f);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100vh; overflow: hidden; }
  body { background: var(--b-bg); color: var(--b-fg); font: 13.5px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--b-high); border: 1px solid var(--b-line); border-radius: 9px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--b-accent); }
  button.on, button.primary { background: var(--b-accent); color: var(--b-on); border-color: var(--b-accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  input, select { background: var(--b-bg); border: 1px solid var(--b-line); border-radius: 8px; padding: 5px 8px; outline: none; }
  input:focus, select:focus { border-color: var(--b-accent); }
  .bar { display: flex; gap: 6px; align-items: center; padding: 7px 10px; background: var(--b-surface);
         border-bottom: 1px solid var(--b-line); overflow-x: auto; flex: 0 0 auto; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  .sep { width: 1px; align-self: stretch; background: var(--b-line); margin: 0 2px; flex: 0 0 auto; }
  #boardName { width: 140px; font-weight: 600; flex: 0 0 auto; }
  #search { width: 130px; flex: 0 0 auto; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--b-line); flex: 0 0 auto; }
  .swatch.on { border-color: var(--b-fg); }
  .muted { color: var(--b-muted); font-size: 12px; white-space: nowrap; }

  #vp { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        cursor: default; background-color: var(--b-bg); background-image: radial-gradient(circle, var(--b-line) 1.2px, transparent 1.3px); }
  #vp.panning { cursor: grabbing; }
  #vp.connecting .card { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; z-index: 1; pointer-events: none; }
  #wires .line { fill: none; stroke-width: 2.2; }
  #wires .hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
  #wires text { font-size: 12px; fill: var(--b-fg); paint-order: stroke; stroke: var(--b-bg); stroke-width: 4px; }
  #temp { stroke: var(--b-accent); stroke-dasharray: 6 5; fill: none; stroke-width: 2; }
  #band { position: absolute; border: 1.5px dashed var(--b-accent); background: var(--b-soft); display: none; z-index: 50; pointer-events: none; }

  .card { position: absolute; border-radius: 12px; background: var(--card, var(--b-surface)); color: var(--ink, var(--b-fg));
          border: 1px solid rgba(0, 0, 0, .14); box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .55); display: flex; flex-direction: column;
          overflow: hidden; z-index: 2; }
  .card.none { border-color: var(--b-line); }
  .card.sel { outline: 2.5px solid var(--b-accent); outline-offset: 2px; z-index: 6; }
  .card.found { box-shadow: 0 0 0 4px #ffd54a; }
  .card.target { outline: 2.5px dashed var(--b-accent); outline-offset: 3px; }
  .card.locked::after { content: "🔒"; position: absolute; right: 6px; top: 4px; font-size: 11px; opacity: .55; }
  .card.heading { background: transparent; border: 0; box-shadow: none; }
  .card.heading .text { font-size: 26px; font-weight: 800; letter-spacing: -.01em; padding: 6px 4px; }
  .card.frame { background: color-mix(in srgb, var(--card, var(--b-surface)) 22%, transparent); border: 2px dashed color-mix(in srgb, var(--card, var(--b-line)) 70%, transparent);
                box-shadow: none; z-index: 0; color: var(--b-fg); }
  .card.frame.sel { z-index: 0; }
  .card.frame .text { font-weight: 700; font-size: 15px; flex: 0 0 auto; }
  .card.code { --card: #10161c; --ink: #d6e2ea; }
  .card.code .text { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 12.5px; white-space: pre; overflow: auto; }
  .text { padding: 10px 12px; white-space: pre-wrap; word-break: break-word; outline: none; flex: 1 1 auto; overflow: hidden; min-height: 1.5em; }
  .text b { font-weight: 700; } .text code { background: rgba(0, 0, 0, .12); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .text ul { margin: 2px 0; padding-left: 18px; } .text a { color: inherit; }
  [contenteditable="true"] { cursor: text; background: rgba(255, 255, 255, .16); user-select: text; -webkit-user-select: text; box-shadow: inset 0 0 0 2px var(--b-accent); }
  .text:empty::before, .item span:empty::before { content: attr(data-hint); opacity: .45; }
  .todo .title { font-weight: 700; padding: 9px 12px 2px; flex: 0 0 auto; }
  .items { padding: 2px 10px 6px; overflow: auto; flex: 1 1 auto; }
  .item { display: flex; gap: 7px; align-items: flex-start; padding: 2px 0; }
  .item input { margin-top: 2px; width: 18px; height: 18px; flex: 0 0 auto; cursor: pointer; }
  .item span { flex: 1; outline: none; min-height: 1.3em; border-radius: 4px; }
  .item .del { border: 0; background: none; color: inherit; opacity: 0; padding: 0 6px; font-size: 14px; line-height: 1.3;
               cursor: pointer; flex: 0 0 auto; border-radius: 6px; }
  .item:hover .del, .card.sel .item .del { opacity: .55; }
  .item .del:hover { opacity: 1; background: rgba(0, 0, 0, .12); }
  .item.done span { text-decoration: line-through; opacity: .6; }
  .add-item { margin: 0 10px 8px; padding: 2px 8px; font-size: 12px; background: rgba(0, 0, 0, .08); border-color: rgba(0, 0, 0, .15); color: inherit; align-self: flex-start; }
  .card img { width: 100%; flex: 1 1 auto; min-height: 0; object-fit: cover; pointer-events: none; display: block; }
  .card.image .text { flex: 0 0 auto; padding: 6px 10px; font-size: 12px; }
  .card.link a { color: inherit; font-size: 12px; word-break: break-all; padding: 0 12px 10px; display: block; opacity: .8; }
  /* Handles stay the same size on screen at any zoom (--h is set from the zoom),
     and only the selected card has them: on hover they used to sit over the
     card's edge and turn a drag into an arrow. */
  #world { --h: 18px; }
  .dot { position: absolute; right: 2px; top: 50%; width: var(--h); height: var(--h); margin-top: calc(var(--h) / -2); border-radius: 50%;
         background: var(--b-accent); border: 2px solid var(--b-bg); display: none; cursor: crosshair; z-index: 3; box-sizing: border-box; }
  .grip { position: absolute; right: 0; bottom: 0; width: var(--h); height: var(--h); cursor: nwse-resize; display: none; z-index: 3;
          background: linear-gradient(135deg, transparent 50%, var(--b-accent) 50%); }
  .card.sel .dot, .card.sel .grip { display: block; }
  .card.sel.multi .dot, .card.sel.multi .grip { display: none; }
  @media (pointer: coarse) { #world { --h: 28px; } .item input { width: 22px !important; height: 22px !important; } }
  .card.locked .grip, .card.locked .dot { display: none !important; }
  .yellow { --card: #fbe38e; --ink: #2a2310; } .green { --card: #b7ebc6; --ink: #0f2a18; }
  .blue { --card: #b9d6ff; --ink: #0d1d33; } .pink { --card: #f9c3d9; --ink: #33101f; }
  .purple { --card: #d6c6ff; --ink: #1d1236; } .orange { --card: #ffd0a6; --ink: #331b06; }
  .gray { --card: #d9dde0; --ink: #1c2125; } .red { --card: #ffb3ad; --ink: #330b08; }
  .hint { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); text-align: center; color: var(--b-muted); pointer-events: none; }
  .hint b { display: block; color: var(--b-fg); font-size: 16px; margin-bottom: 4px; }
  .zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center; background: var(--b-surface);
          border: 1px solid var(--b-line); border-radius: 10px; padding: 4px; z-index: 40; }
  .zoom span { min-width: 44px; text-align: center; font-size: 12px; }
  .menu { position: fixed; z-index: 60; background: var(--b-surface); border: 1px solid var(--b-line); border-radius: 12px;
          padding: 5px; min-width: 190px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .7); display: flex; flex-direction: column; }
  .menu button { border: 0; background: none; text-align: left; border-radius: 8px; padding: 7px 10px; }
  .menu button:hover { background: var(--b-high); }
  .menu hr { border: 0; border-top: 1px solid var(--b-line); margin: 4px 2px; width: auto; }
  .menu .danger { color: var(--b-danger); }
  .sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 70; }
  .sheet[hidden] { display: none; }
  .sheet .box { background: var(--b-surface); border: 1px solid var(--b-line); border-radius: 14px; width: min(480px, 100%);
                max-height: 86vh; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .sheet h3 { margin: 0; font-size: 15px; }
  .sheet .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .sheet .list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow: auto; }
  .sheet .list button { text-align: left; }
  .tpl { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .tpl button { padding: 12px 8px; text-align: left; }
  .tpl small { display: block; color: var(--b-muted); font-size: 11.5px; }
  .toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: var(--b-high); border: 1px solid var(--b-accent);
           padding: 7px 13px; border-radius: 10px; z-index: 80; max-width: 90%; pointer-events: none; }
</style>
</head>
<body>
<div class="bar">
  <select id="boards" title="Your boards"></select>
  <input id="boardName" spellcheck="false" title="This board's name">
  <button id="bNew" title="A new board, blank or from a template">New</button>
  <span class="sep"></span>
  <button id="bAdd" class="primary" title="Add a card (N for a note)">+ Add</button>
  <button id="bSelect" title="Select several: drag a box around cards (or hold Shift)">▢ Select</button>
  <button id="bConnect" title="Connect: tap one card, then another (or drag a card's green dot)">↗ Connect</button>
  <span class="sep"></span>
  <span id="swatches" style="display:flex;gap:4px"></span>
  <button id="bMore" title="More for what is selected (or right-click / long-press a card)">⋯</button>
  <span class="sep"></span>
  <input id="search" placeholder="Find…  (Ctrl+F)" spellcheck="false">
  <button id="bSnap" title="Snap cards to the grid">Snap</button>
  <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
  <button id="bExport" title="Export as a picture or Markdown">Export</button>
  <button id="bSync" title="Keep Notes the same on your phone and PC (needs your PyCmd account)">☁ Sync</button>
  <span class="muted" id="saved"></span>
</div>
<div id="vp">
  <div id="world"><svg id="wires"><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs><g id="links"></g><path id="temp"/></svg></div>
  <div id="band"></div>
  <div class="hint" id="hint" hidden><b>An empty board</b>Double-click (or double-tap) anywhere to add a note, or press + Add.</div>
  <div class="zoom"><button id="zOut" title="Zoom out">−</button><span id="zLabel">100%</span><button id="zIn" title="Zoom in">+</button><button id="zFit" title="Show everything (F)">Fit</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
(function () {
  'use strict';
  if (!window.PyBoard && window.PyBoardNative) {
    window.PyBoard = { call: function (n, p) { return Promise.resolve(JSON.parse(window.PyBoardNative.call(n, JSON.stringify(p || {})))); } };
  }
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['none', 'yellow', 'green', 'blue', 'pink', 'purple', 'orange', 'red', 'gray'];
  var SW = { none: 'transparent', yellow: '#fbe38e', green: '#b7ebc6', blue: '#b9d6ff', pink: '#f9c3d9', purple: '#d6c6ff', orange: '#ffd0a6', red: '#ffb3ad', gray: '#d9dde0' };
  var SIZES = { note: [220, 140], heading: [320, 60], todo: [240, 150], image: [260, 220], link: [240, 90], code: [320, 170], frame: [420, 320] };
  var B = null, id = '', sel = [], selLink = null, past = [], future = [], connect = false, connectFrom = null;
  var selectMode = false, saveTimer = 0, syncTimer = 0, cloudOn = true, editing = null, clip = null, found = [], foundAt = -1;
  var vp = $('vp'), world = $('world'), n = 0;
  function uid(p) { n += 1; return p + Date.now().toString(36) + n; }
  function call(name, payload) {
    return window.PyBoard.call(name, payload || {}).then(function (r) { return r || {}; }, function (e) { return { ok: false, error: String(e) }; });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var tt = 0;
  function toast(t) { var x = document.querySelector('.toast') || document.body.appendChild(el('div', 'toast')); x.textContent = t; x.hidden = false; clearTimeout(tt); tt = setTimeout(function () { x.hidden = true; }, 2400); }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // A little Markdown, for reading: **bold**, *italic*, `code`, links and "- " lists.
  function rich(text) {
    var lines = esc(text).split('\n'), out = [], list = false;
    lines.forEach(function (l) {
      var m = /^\s*[-*] (.*)$/.exec(l);
      if (m) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if (list) { out.push('</ul>'); list = false; }
      out.push(inline(l) + '\n');
    });
    if (list) out.push('</ul>');
    return out.join('').replace(/\n$/, '');
  }
  function inline(t) {
    return t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  // ------------------------------------------------------------ model
  function card(cid) { for (var i = 0; i < B.cards.length; i++) if (B.cards[i].id === cid) return B.cards[i]; return null; }
  function selected() { return sel.map(card).filter(Boolean); }
  function snap() { return JSON.stringify({ cards: B.cards, links: B.links, name: B.name }); }
  function remember() { past.push(snap()); if (past.length > 100) past.shift(); future = []; buttons(); }
  function restore(t) { var d = JSON.parse(t); B.cards = d.cards; B.links = d.links; B.name = d.name; $('boardName').value = B.name; sel = sel.filter(card); selLink = null; draw(); changed(); }
  function undo() { stopEdit(); if (!past.length) return; future.push(snap()); restore(past.pop()); }
  function redo() { stopEdit(); if (!future.length) return; past.push(snap()); restore(future.pop()); }
  function buttons() { $('bUndo').disabled = !past.length; $('bRedo').disabled = !future.length; }
  function changed() {
    buttons(); $('saved').textContent = '…'; clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      call('save', { id: id, board: B }).then(function (r) { $('saved').textContent = r.ok ? 'saved' : 'not saved'; if (!r.ok) toast(r.error || 'That did not save.'); });
    }, 600);
    // and to your other devices, quietly, once you stop for a moment
    clearTimeout(syncTimer); if (cloudOn) syncTimer = setTimeout(function () { sync(true); }, 15000);
  }
  function snapTo(v) { return B.view.snap ? Math.round(v / 20) * 20 : Math.round(v); }

  // ------------------------------------------------------------ view
  function applyView() {
    var v = B.view; world.style.transform = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.z + ')';
    var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    world.style.setProperty('--h', Math.min(60, Math.max(10, (coarse ? 28 : 18) / v.z)) + 'px');
    vp.style.backgroundSize = (22 * v.z) + 'px ' + (22 * v.z) + 'px';
    vp.style.backgroundPosition = v.x + 'px ' + v.y + 'px';
    $('zLabel').textContent = Math.round(v.z * 100) + '%';
    $('bSnap').classList.toggle('on', !!v.snap);
  }
  function toWorld(cx, cy) { var r = vp.getBoundingClientRect(), v = B.view; return { x: (cx - r.left - v.x) / v.z, y: (cy - r.top - v.y) / v.z }; }
  function zoomAt(z, cx, cy) {
    var r = vp.getBoundingClientRect(), v = B.view, nz = Math.min(3, Math.max(.15, z));
    var px = cx == null ? r.width / 2 : cx - r.left, py = cy == null ? r.height / 2 : cy - r.top;
    v.x = px - (px - v.x) * (nz / v.z); v.y = py - (py - v.y) * (nz / v.z); v.z = nz; applyView();
  }
  function bounds(cards) {
    var b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    cards.forEach(function (c) { b.x0 = Math.min(b.x0, c.x); b.y0 = Math.min(b.y0, c.y); b.x1 = Math.max(b.x1, c.x + c.w); b.y1 = Math.max(b.y1, c.y + c.h); });
    return b;
  }
  function fit(cards) {
    cards = cards || B.cards;
    if (!cards.length) { B.view.x = 0; B.view.y = 0; B.view.z = 1; applyView(); return; }
    var b = bounds(cards), r = vp.getBoundingClientRect(), pad = 50;
    var z = Math.max(.15, Math.min(1.4, (r.width - pad * 2) / (b.x1 - b.x0), (r.height - pad * 2) / (b.y1 - b.y0)));
    B.view.z = z; B.view.x = (r.width - (b.x1 - b.x0) * z) / 2 - b.x0 * z; B.view.y = (r.height - (b.y1 - b.y0) * z) / 2 - b.y0 * z; applyView();
  }
  var viewTimer = 0;
  function saveView() { clearTimeout(viewTimer); viewTimer = setTimeout(changed, 900); }

  // ------------------------------------------------------------ drawing
  function draw() {
    Array.prototype.slice.call(world.querySelectorAll('.card')).forEach(function (x) { x.remove(); });
    B.cards.forEach(function (c) { world.appendChild(cardEl(c)); });
    wires(); mark(); $('hint').hidden = B.cards.length > 0; applyView();
  }
  function textNode(c, cls, value, hint, single, set) {
    var t = el('div', cls); t.dataset.edit = '1'; t.dataset.hint = hint; if (single) t.dataset.single = '1';
    t._raw = value || ''; t._set = set;
    if (c.type === 'code' || single) t.textContent = t._raw; else t.innerHTML = rich(t._raw);
    return t;
  }
  function cardEl(c) {
    var d = el('div', 'card ' + c.type + ' ' + (c.color || 'none') + (c.locked ? ' locked' : ''));
    d.dataset.id = c.id; place(d, c);
    var set = function (v) { c.text = v; };
    if (c.type === 'image') {
      var img = el('img'); img.src = c.src || ''; img.alt = c.text || 'image'; d.appendChild(img);
      d.appendChild(textNode(c, 'text', c.text, 'caption', true, set));
    } else if (c.type === 'todo') {
      d.appendChild(textNode(c, 'text title', c.text, 'List', true, set));
      var list = el('div', 'items');
      (c.items || []).forEach(function (it, i) {
        var row = el('div', 'item' + (it.done ? ' done' : ''));
        var box = el('input'); box.type = 'checkbox'; box.checked = !!it.done;
        box.addEventListener('change', function () { remember(); it.done = box.checked; row.classList.toggle('done', it.done); changed(); });
        var span = el('span'); span.dataset.edit = '1'; span.dataset.single = '1'; span.dataset.item = String(i); span.dataset.hint = 'item';
        span.textContent = it.t || ''; span._raw = it.t || ''; span._set = function (v) { it.t = v; };
        var del = el('button', 'del', '✕'); del.dataset.act = 'del-item'; del.dataset.item = String(i); del.title = 'Delete this item';
        row.appendChild(box); row.appendChild(span); row.appendChild(del); list.appendChild(row);
      });
      d.appendChild(list);
      var add = el('button', 'add-item', '+ item'); add.dataset.act = 'add-item'; d.appendChild(add);
    } else {
      var hint = { heading: 'Heading', link: 'Title', frame: 'Section', code: '// code' }[c.type] || 'Write something…';
      d.appendChild(textNode(c, 'text', c.text, hint, c.type === 'heading' || c.type === 'frame' || c.type === 'link', set));
      if (c.type === 'link') { var a = el('a', '', c.url || ''); a.href = c.url || '#'; a.target = '_blank'; a.rel = 'noopener'; d.appendChild(a); }
    }
    d.appendChild(el('div', 'dot')); d.appendChild(el('div', 'grip'));
    return d;
  }
  function redrawCard(c) { var old = world.querySelector('.card[data-id="' + c.id + '"]'); var neu = cardEl(c); if (old) old.replaceWith(neu); else world.appendChild(neu); mark(); wires(); }

      B.cards.filter(function (c) { return c.type === 'frame'; }).concat(B.cards.filter(function (c) { return c.type !== 'frame'; })).forEach(function (c) {
        var bg = SW[c.color] || '#1a231e', r = 12;
        g.save(); g.beginPath(); if (g.roundRect) g.roundRect(c.x, c.y, c.w, c.h, r); else g.rect(c.x, c.y, c.w, c.h);
        if (c.type === 'frame') { g.globalAlpha = .22; g.fillStyle = bg; g.fill(); g.globalAlpha = 1; g.setLineDash([8, 6]); g.strokeStyle = bg; g.lineWidth = 2; g.stroke(); }
        else if (c.type !== 'heading') { g.fillStyle = c.type === 'code' ? '#10161c' : (c.color === 'none' ? '#1a231e' : bg); g.fill(); }
        g.clip(); g.fillStyle = c.type === 'code' ? '#d6e2ea' : ink(c);
        if (c.type === 'image' && loaded[c.id]) { g.drawImage(loaded[c.id], c.x, c.y, c.w, c.h - 26); g.font = '12px system-ui'; g.fillText(c.text || '', c.x + 10, c.y + c.h - 9); }
        else if (c.type === 'heading') { g.font = '800 26px system-ui'; wrap(c.text, c.x + 4, c.y + 34, c.w - 8, 30, c.y + c.h); }
        else if (c.type === 'todo') {
          g.font = '700 14px system-ui'; var y = wrap(c.text || 'To do', c.x + 12, c.y + 24, c.w - 24, 20, c.y + c.h); g.font = '13.5px system-ui';
          (c.items || []).forEach(function (it) { g.fillText((it.done ? '☑ ' : '☐ ') + (it.t || ''), c.x + 12, y + 4); y += 22; });
        } else { g.font = c.type === 'code' ? '12.5px monospace' : (c.type === 'frame' ? '700 15px system-ui' : '14px system-ui'); wrap(c.text, c.x + 12, c.y + 26, c.w - 24, 20, c.y + c.h); }
        g.restore();
      });
      B.links.forEach(function (l) {
        var geo = linkGeometry(l); g.strokeStyle = l.color && l.color !== 'none' ? SW[l.color] : '#8b9a90'; g.lineWidth = 2.2; g.setLineDash(l.dashed ? [7, 6] : []);
        g.beginPath(); g.moveTo(geo.p.x, geo.p.y); g.lineTo(geo.q.x, geo.q.y); g.stroke(); g.setLineDash([]);
        var head = function (from, to) { var a = Math.atan2(to.y - from.y, to.x - from.x); g.fillStyle = g.strokeStyle; g.beginPath(); g.moveTo(to.x, to.y);
          g.lineTo(to.x - 11 * Math.cos(a - .4), to.y - 11 * Math.sin(a - .4)); g.lineTo(to.x - 11 * Math.cos(a + .4), to.y - 11 * Math.sin(a + .4)); g.fill(); };
        if ((l.style || 'arrow') !== 'line') head(geo.p, geo.q); if (l.style === 'both') head(geo.q, geo.p);
        if (l.label) { g.font = '12px system-ui'; g.fillStyle = css.color; g.textAlign = 'center'; g.fillText(l.label, (geo.p.x + geo.q.x) / 2, (geo.p.y + geo.q.y) / 2 - 7); g.textAlign = 'start'; }
      });
      call('export_png', { board: { name: B.name }, png: cv.toDataURL('image/png') }).then(function (r) { toast(r.ok ? 'Saved ' + r.path : (r.error || 'That did not save.')); });
    });
  }

  // ------------------------------------------------------------ pointers
  // Double-click, double-tap and long-press are worked out here, from the
  // pointer events, rather than left to the browser: the board holds the
  // pointer while dragging, and a held pointer never delivers a dblclick to
  // the text inside a card - which is why 3.6 could not edit text.
  var pointers = {}, gesture = null, last = { t: 0, key: '', x: 0, y: 0 }, pressTimer = 0;
  function cancelPress() { clearTimeout(pressTimer); pressTimer = 0; }
  vp.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  vp.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.zoom')) return;
    if (editing && editing.contains(e.target)) return;              // placing the caret
    if (e.target.closest('input[type=checkbox], a')) return;
    var delItem = e.target.closest('[data-act="del-item"]');
    if (delItem) {
      var dc = card(delItem.closest('.card').dataset.id);
      if (!dc.locked) deleteItem(dc, Number(delItem.dataset.item));
      return;
    }
    var rowHit = e.target.closest('.item');
    if (rowHit && e.button !== 2) {   // the space left of an item's text ticks it, like its box
      var boxRect = rowHit.querySelector('input').getBoundingClientRect();
      if (e.clientX < boxRect.right + 6) { var tick = rowHit.querySelector('input'); tick.click(); return; }
    }
    var addItem = e.target.closest('[data-act="add-item"]');
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      cancelPress(); var a = pointers[ids[0]], b = pointers[ids[1]];
      gesture = { kind: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), z: B.view.z, vx: B.view.x, vy: B.view.y, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
      return;
    }
    stopEdit(); closeMenu();
    var now = Date.now(), cardNode = e.target.closest('.card'), linkHit = e.target.dataset && e.target.dataset.link;
    var key = cardNode ? cardNode.dataset.id : (linkHit ? 'l:' + linkHit : 'bg');
    var double = now - last.t < 400 && last.key === key && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 24;
    last = { t: double ? 0 : now, key: key, x: e.clientX, y: e.clientY };

    if (e.button === 2) {   // right-click
      if (cardNode) cardMenu(e.clientX, e.clientY, card(cardNode.dataset.id));
      else if (linkHit) linkMenu(e.clientX, e.clientY, B.links.filter(function (l) { return l.id === linkHit; })[0]);
      else addMenu(e.clientX, e.clientY, toWorld(e.clientX, e.clientY));
      return;
    }
    if (addItem) {
      var ac = card(cardNode.dataset.id); remember(); ac.items = ac.items || []; ac.items.push({ t: '', done: false }); grow(ac); redrawCard(ac); changed();
      var spans = nodeOf(ac).querySelectorAll('.item span'); var target = spans[spans.length - 1]; setTimeout(function () { startEdit(target); }, 0);
      return;
    }
    if (linkHit) {
      var l = B.links.filter(function (x) { return x.id === linkHit; })[0];
      if (double) { ask('Label this arrow', [{ name: 'label', value: l.label || '' }]).then(function (v) { if (v) { remember(); l.label = v.label.slice(0, 60); wires(); changed(); } }); return; }
      selLink = l.id; sel = []; mark(); wires();
      pressTimer = setTimeout(function () { gesture = null; linkMenu(e.clientX, e.clientY, l); }, 550);
      gesture = { kind: 'none', x: e.clientX, y: e.clientY };
      return;
    }
    if (cardNode) {
      var c = card(cardNode.dataset.id);
      if (connect) {
        if (!connectFrom) { connectFrom = c.id; sel = [c.id]; mark(); toast('Now tap the card to connect it to.'); }
        else { makeLink(connectFrom, c.id); toggleConnect(false); }
        return;
      }
      if (double && !e.target.classList.contains('dot')) { editCard(c, { x: e.clientX, y: e.clientY }); return; }
      if (e.shiftKey || e.ctrlKey || e.metaKey) { var at = sel.indexOf(c.id); if (at >= 0) sel.splice(at, 1); else sel.push(c.id); selLink = null; mark(); wires(); return; }
      if (sel.indexOf(c.id) < 0) sel = [c.id];
      selLink = null; mark(); wires();
      if (e.target.classList.contains('dot')) { gesture = { kind: 'wire', from: c.id }; return; }
      if (e.target.classList.contains('grip') && !c.locked) { gesture = { kind: 'resize', c: c, x: e.clientX, y: e.clientY, w: c.w, h: c.h, moved: false }; return; }
      var moving = selected().filter(function (x) { return !x.locked; });
      selected().forEach(function (x) { if (x.type === 'frame' && !x.locked) insideFrame(x).forEach(function (k) { if (moving.indexOf(k) < 0 && !k.locked) moving.push(k); }); });
      gesture = { kind: 'move', x: e.clientX, y: e.clientY, moved: false, items: moving.map(function (x) { return { c: x, x: x.x, y: x.y }; }) };
      pressTimer = setTimeout(function () { if (gesture && !gesture.moved) { gesture = null; cardMenu(e.clientX, e.clientY, c); } }, 550);
      return;
    }
    // the background
    if (connect) { toggleConnect(false); return; }
    if (double) { addCard('note', null, toWorld(e.clientX, e.clientY)); return; }
    if (selectMode || e.shiftKey) {
      gesture = { kind: 'band', x: e.clientX, y: e.clientY, keep: e.shiftKey ? sel.slice() : [] };
      return;
    }
    sel = []; selLink = null; mark(); wires();
    gesture = { kind: 'pan', x: e.clientX, y: e.clientY, vx: B.view.x, vy: B.view.y };
    pressTimer = setTimeout(function () { if (gesture && gesture.kind === 'pan' && Math.hypot(gesture.lx - gesture.x || 0, gesture.ly - gesture.y || 0) < 8) { gesture = null; addMenu(e.clientX, e.clientY, toWorld(e.clientX, e.clientY)); } }, 600);
  });
  vp.addEventListener('pointermove', function (e) {
    if (pointers[e.pointerId]) pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (!gesture) return;
    var z = B.view.z, far = Math.hypot(e.clientX - (gesture.x || 0), e.clientY - (gesture.y || 0)) > 6;
    if (far) cancelPress();
    if (gesture.kind === 'pinch') {
      var ids = Object.keys(pointers); if (ids.length < 2) return;
      var a = pointers[ids[0]], b = pointers[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      B.view.x = gesture.vx + (cx - gesture.cx); B.view.y = gesture.vy + (cy - gesture.cy); B.view.z = gesture.z;
      zoomAt(gesture.z * d / gesture.d, cx, cy);
    } else if (gesture.kind === 'pan') {
      gesture.lx = e.clientX; gesture.ly = e.clientY;
      if (!gesture.moved && !far) return;
      if (!gesture.moved) { gesture.moved = true; vp.classList.add('panning'); try { vp.setPointerCapture(e.pointerId); } catch (x) { /* fine */ } }
      B.view.x = gesture.vx + e.clientX - gesture.x; B.view.y = gesture.vy + e.clientY - gesture.y; applyView();
    } else if (gesture.kind === 'move') {
      if (!gesture.moved && !far) return;
      if (!gesture.moved) { remember(); gesture.moved = true; try { vp.setPointerCapture(e.pointerId); } catch (x) { /* fine */ } }
      var dx = (e.clientX - gesture.x) / z, dy = (e.clientY - gesture.y) / z;
      gesture.items.forEach(function (it) { it.c.x = snapTo(it.x + dx); it.c.y = snapTo(it.y + dy); var d = nodeOf(it.c); if (d) place(d, it.c); });
      wires();
    } else if (gesture.kind === 'resize') {
      if (!gesture.moved) { remember(); gesture.moved = true; try { vp.setPointerCapture(e.pointerId); } catch (x) { /* fine */ } }
      gesture.c.w = Math.max(90, snapTo(gesture.w + (e.clientX - gesture.x) / z)); gesture.c.h = Math.max(40, snapTo(gesture.h + (e.clientY - gesture.y) / z));
      place(nodeOf(gesture.c), gesture.c); wires();
    } else if (gesture.kind === 'wire') {
      try { vp.setPointerCapture(e.pointerId); } catch (x) { /* fine */ }
      var from = card(gesture.from), p = toWorld(e.clientX, e.clientY), s = edgePoint(from, p.x, p.y);
      $('temp').setAttribute('d', 'M' + s.x + ',' + s.y + ' L' + p.x + ',' + p.y);
      var over = document.elementFromPoint(e.clientX, e.clientY), t = over && over.closest && over.closest('.card');
      Array.prototype.forEach.call(world.querySelectorAll('.card.target'), function (x) { x.classList.remove('target'); });
      if (t && t.dataset.id !== gesture.from) t.classList.add('target');
    } else if (gesture.kind === 'band') {
      try { vp.setPointerCapture(e.pointerId); } catch (x) { /* fine */ }
      var r = vp.getBoundingClientRect(), x0 = Math.min(gesture.x, e.clientX), y0 = Math.min(gesture.y, e.clientY);
      var band = $('band'); band.style.display = 'block'; band.style.left = (x0 - r.left) + 'px'; band.style.top = (y0 - r.top) + 'px';
      band.style.width = Math.abs(e.clientX - gesture.x) + 'px'; band.style.height = Math.abs(e.clientY - gesture.y) + 'px';
      var a1 = toWorld(x0, y0), a2 = toWorld(Math.max(gesture.x, e.clientX), Math.max(gesture.y, e.clientY));
      sel = gesture.keep.concat(B.cards.filter(function (c) { return c.x < a2.x && c.x + c.w > a1.x && c.y < a2.y && c.y + c.h > a1.y; }).map(function (c) { return c.id; }));
      mark();
    }
  });
  function endPointer(e) {
    delete pointers[e.pointerId]; cancelPress();
    if (!gesture) return;
    if (gesture.kind === 'wire') {
      $('temp').setAttribute('d', '');
      var over = document.elementFromPoint(e.clientX, e.clientY), t = over && over.closest && over.closest('.card');
      Array.prototype.forEach.call(world.querySelectorAll('.card.target'), function (x) { x.classList.remove('target'); });
      if (t) makeLink(gesture.from, t.dataset.id);
    }
    if (gesture.kind === 'band') { $('band').style.display = 'none'; if (selectMode && sel.length) toggleSelect(false); }
    if ((gesture.kind === 'move' || gesture.kind === 'resize') && gesture.moved) changed();
    if (gesture.kind === 'pan' || gesture.kind === 'pinch') saveView();
    if (gesture.kind === 'pinch' && Object.keys(pointers).length) { gesture = null; return; }
    gesture = null; vp.classList.remove('panning');
  }
  vp.addEventListener('pointerup', endPointer);
  vp.addEventListener('pointercancel', endPointer);
  vp.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey || (Math.abs(e.deltaY) >= 40 && !e.deltaX && !e.shiftKey)) zoomAt(B.view.z * Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY);
    else { B.view.x -= e.shiftKey ? e.deltaY : e.deltaX; B.view.y -= e.shiftKey ? 0 : e.deltaY; applyView(); }
    saveView();
  }, { passive: false });

  // ------------------------------------------------------------ toolbar
  $('bConnect').onclick = function () { toggleConnect(!connect); };
  $('bSelect').onclick = function () { toggleSelect(!selectMode); };
  $('bAdd').onclick = function (e) { var r = e.currentTarget.getBoundingClientRect(); addMenu(r.left, r.bottom + 4); };
  $('bMore').onclick = function (e) {
    var r = e.currentTarget.getBoundingClientRect(), first = selected()[0];
    if (first) cardMenu(r.left, r.bottom + 4, first);
    else if (selLink) linkMenu(r.left, r.bottom + 4, B.links.filter(function (l) { return l.id === selLink; })[0]);
    else menu(r.left, r.bottom + 4, [
      { label: '⤢  Show everything', run: function () { fit(); saveView(); } },
      { label: '▢  Select all', run: function () { sel = B.cards.map(function (c) { return c.id; }); mark(); } },
      { label: '✎  Rename this board', run: function () { $('boardName').focus(); $('boardName').select(); } },
      '-',
      { label: '✕  Delete this board', danger: true, run: function () { ask('Delete "' + B.name + '"? Type DELETE to confirm.', [{ name: 'yes', hint: 'DELETE' }]).then(function (v) { if (v && v.yes.toUpperCase() === 'DELETE') call('remove', { id: id }).then(function () { open(''); toast('Board deleted.'); }); }); } },
    ]);
  };
  // Notes on every device, through the account's cloud storage. Quiet when it
  // runs by itself; a sign-in hint only when the button is pressed.
  function sync(quiet) {
    if (!quiet) { $('saved').textContent = 'syncing…'; }
    return call('sync', { id: id }).then(function (r) {
      if (!r.ok) {
        if (r.signed_out) cloudOn = false;
        if (!quiet) { $('saved').textContent = ''; toast(r.error || 'That did not sync.'); }
        return;
      }
      cloudOn = true;
      $('saved').textContent = 'synced';
      if (!quiet) toast(r.pulled ? r.pulled + (r.pulled === 1 ? ' board' : ' boards') + ' came from your other devices.' : 'Up to date on every device.');
      if (r.pulled && !editing && !(gesture && gesture.moved)) open(id);
    });
  }
  $('bSync').onclick = function () { cloudOn = true; sync(false); };
  $('bExport').onclick = function (e) { var r = e.currentTarget.getBoundingClientRect(); exportMenu(r.left, r.bottom + 4); };
  $('bSnap').onclick = function () { B.view.snap = !B.view.snap; applyView(); changed(); };
  COLORS.forEach(function (c) {
    var s = el('button', 'swatch'); s.dataset.c = c; s.title = c === 'none' ? 'No colour' : c; s.style.background = SW[c];
    if (c === 'none') s.style.backgroundImage = 'linear-gradient(135deg, transparent 45%, var(--b-danger) 45%, var(--b-danger) 55%, transparent 55%)';
    s.onclick = function () {
      if (selLink) { remember(); B.links.forEach(function (l) { if (l.id === selLink) l.color = c; }); wires(); changed(); return; }
      if (!sel.length) return toast('Select a card first.');
      remember(); selected().forEach(function (x) { x.color = c; redrawCard(x); }); changed();
    };
    $('swatches').appendChild(s);
  });
  $('bUndo').onclick = undo; $('bRedo').onclick = redo;
  $('zIn').onclick = function () { zoomAt(B.view.z * 1.25); saveView(); };
  $('zOut').onclick = function () { zoomAt(B.view.z / 1.25); saveView(); };
  $('zFit').onclick = function () { fit(); saveView(); };
  $('boardName').addEventListener('input', function (e) { B.name = e.target.value; refreshList(); changed(); });
  $('boardName').addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') e.target.blur(); });
  $('boards').onchange = function () { open($('boards').value); };
  $('bNew').onclick = newBoard;
  $('search').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    found = !q ? [] : B.cards.filter(function (c) {
      return (c.text || '').toLowerCase().indexOf(q) >= 0 || (c.url || '').toLowerCase().indexOf(q) >= 0 ||
        (c.items || []).some(function (i) { return (i.t || '').toLowerCase().indexOf(q) >= 0; });
    }).map(function (c) { return c.id; });
    foundAt = found.length ? 0 : -1; jump();
  });
  $('search').addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter' && found.length) { foundAt = (foundAt + (e.shiftKey ? found.length - 1 : 1)) % found.length; jump(); }
    if (e.key === 'Escape') { this.value = ''; found = []; mark(); this.blur(); }
  });
  function jump() {
    mark(); $('saved').textContent = found.length ? (foundAt + 1) + ' of ' + found.length : ($('search').value ? 'not found' : '');
    var c = card(found[foundAt]); if (!c) return;
    var r = vp.getBoundingClientRect();
    B.view.x = r.width / 2 - (c.x + c.w / 2) * B.view.z; B.view.y = r.height / 2 - (c.y + c.h / 2) * B.view.z; applyView();
  }
  document.addEventListener('keydown', function (e) {
    if (editing || !$('sheet').hidden || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var mod = e.ctrlKey || e.metaKey, k = (e.key || '').toLowerCase();
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if (mod && k === 'd') { e.preventDefault(); duplicate(); }
    else if (mod && k === 'a') { e.preventDefault(); sel = B.cards.map(function (c) { return c.id; }); mark(); }
    else if (mod && k === 'c' && sel.length) { copyCards(); }
    else if (mod && k === 'f') { e.preventDefault(); $('search').focus(); }
    else if (k === 'delete' || k === 'backspace') { e.preventDefault(); removeSel(); }
    else if (k === 'escape') { sel = []; selLink = null; toggleConnect(false); toggleSelect(false); closeMenu(); mark(); wires(); }
    else if (k === 'n' && !mod) { e.preventDefault(); addCard('note'); }
    else if (k === 'f' && !mod) { e.preventDefault(); fit(); saveView(); }
    else if (k === 'enter' && sel.length === 1) { e.preventDefault(); editCard(card(sel[0])); }
    else if (k.indexOf('arrow') === 0 && sel.length) {
      e.preventDefault(); var step = e.shiftKey ? 20 : 2, dx = k === 'arrowleft' ? -step : k === 'arrowright' ? step : 0, dy = k === 'arrowup' ? -step : k === 'arrowdown' ? step : 0;
      selected().forEach(function (c) { if (!c.locked) { c.x += dx; c.y += dy; place(nodeOf(c), c); } }); wires(); changed();
    }
  });

  // ------------------------------------------------------------ boards
  var listing = [];
  function refreshList() {
    var s = $('boards'); s.innerHTML = '';
    listing.forEach(function (b) { var o = el('option', '', b.id === id ? (B.name || 'Board') : b.name); o.value = b.id; if (b.id === id) o.selected = true; s.appendChild(o); });
  }
  function open(which) {
    return call('listing').then(function (l) { listing = l.boards || []; return call('load', { id: which || l.current }); }).then(function (r) {
      if (!r.ok) return toast(r.error || 'That board would not open.');
      id = r.id; B = r.board; B.cards = B.cards || []; B.links = B.links || []; B.view = B.view || { x: 0, y: 0, z: 1 };
      past = []; future = []; sel = []; selLink = null; buttons(); $('boardName').value = B.name || 'Board'; refreshList(); draw();
      if (!B.view.x && !B.view.y && B.view.z === 1 && B.cards.length) fit();
      $('saved').textContent = '';
    });
  }
  window.boardReload = function () { open(id); };
  (function start(tries) {
    if (window.PyBoard) { open('').then(function () { sync(true); }); return; }
    if (tries > 250) { document.body.innerHTML = '<p style="padding:20px">Notes could not reach PyCmd.</p>'; return; }
    setTimeout(function () { start(tries + 1); }, 40);
  }(0));
}());
</script>
