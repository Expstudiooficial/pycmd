# Builds PyCmd.exe on a real Windows machine.
#
# This exists because the exe cannot honestly be built anywhere else. Windows
# is where PyInstaller produces a Windows binary, and it is the only place the
# result can be started to see whether it opens. So the repository holds the
# source and the recipe, and this makes the artefact.
#
# Push a tag like `windows-v1.0.0` or `windows-4.0.5` and it builds, checks,
# hashes and attaches the exe to a release. Run it by hand from the Actions
# tab to get a build without publishing one.

name: PyCmd for Windows

on:
  push:
    tags: ["windows-*"]
    branches: [windowsmain]
    paths:
      - "windows/**"
      - "app/src/main/python/**"
      - "app/src/main/assets/**"
      - "tools/test_windows.py"
      - ".github/workflows/windows.yml"
  release:
    types: [published]
  pull_request:
    paths: ["windows/**", "app/src/main/python/**"]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish to this release, e.g. windows-4.0.5. Use after this workflow
          is installed on the repository's default branch. Otherwise push the
          Windows tag to start a release build. Leave empty to only build.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # A ceiling, because a hung step is otherwise six hours of somebody's
    # runner minutes. Everything here should finish inside fifteen.
    timeout-minutes: 30
    # The release this run publishes: the tag that was pushed, or the one asked
    # for when started by hand. Empty means build and check, publish nothing.
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/windows-') && github.ref_name || github.event.release.tag_name || inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Without this, setup-python looks for a requirements.txt at the
          # repository root, finds none, and fails the whole job in one
          # second - every step after it skipped. The build's requirements
          # live with the build.
          cache-dependency-path: windows/build/requirements.txt

      - name: Install what the build needs
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/build/requirements.txt

      - name: A tag must agree with the version in the source
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ("$env:RELEASE_TAG" -notmatch '^windows-(v)?\d') { throw "a Windows release tag must be windows-<version> or windows-v<version>, not '$env:RELEASE_TAG'" }
          python tools/make_latest_windows.py --agrees-with-tag "$env:RELEASE_TAG"

      - name: Check
        run: python tools/test_windows.py

      - name: Check Windows UI navigation
        run: node tools/test_windows_ui.js

      - name: Build
        run: python -m PyInstaller windows/build/pycmd.spec --noconfirm --distpath dist-windows/build

      - name: Prove it starts and the bundle is complete
        shell: pwsh
        run: |
          $exe = "dist-windows/build/PyCmd.exe"
          if (-not (Test-Path $exe)) { throw "no exe was produced" }

          # Start-Process -Wait, not `& $exe`. This is a windowed build, and
          # PowerShell does not wait for a GUI-subsystem process invoked with
          # the call operator - it returns at once and $LASTEXITCODE means
          # nothing. -Wait -PassThru gives a real exit code.
          #
          # --selftest boots the whole engine inside the packed exe: it
          # imports the shared modules, installs the five bundled plugins,
          # and checks the web assets and guides are in the bundle. A missing
          # hidden import shows up here and nowhere else, because from a
          # checkout every file is on the disk anyway.
          $log = "selftest.txt"
          $run = Start-Process -FilePath $exe -ArgumentList "--selftest" `
                   -Wait -PassThru -NoNewWindow `
                   -RedirectStandardOutput $log -RedirectStandardError "selftest-err.txt"
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if (Test-Path "selftest-err.txt") { Get-Content "selftest-err.txt" | Write-Host }
          if ($run.ExitCode -ne 0) {
            throw "the exe ran but its bundle is not complete (exit $($run.ExitCode))"
          }
          Write-Host "the bundle is complete"

          # Informational. A windowed build may have nowhere to print when its
          # output is not redirected, so this is not something to fail on - the
          # exit code above is the proof.
          $v = Start-Process -FilePath $exe -ArgumentList "--version" `
                 -Wait -PassThru -NoNewWindow -RedirectStandardOutput "version.txt"
          if (Test-Path "version.txt") { Write-Host ("it says: " + (Get-Content "version.txt" -Raw)) }
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          $version = python -c "import sys; sys.path.insert(0, 'windows'); from pycmd_win import host; print(host.VERSION)"
          & $iscc "/DAppVersion=$version" "/DSourceExe=$PWD\dist-windows\build\PyCmd.exe" windows\build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          if (-not (Test-Path dist-windows/build/PyCmd-Setup.exe)) { throw "no installer was produced" }

      # Installs it the way a person would get it, updates it the way PyCmd
      # updates itself (the same installer over the top, silently), and takes
      # it off again - on a real Windows machine, every build.
      - name: Prove the installer installs, updates and uninstalls
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist-windows/build/PyCmd-Setup.exe).Path
          $quiet = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/nolaunch=1")
          $p = Start-Process $setup -ArgumentList $quiet -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "a silent install exited $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\PyCmd\PyCmd.exe"
          if (-not (Test-Path $exe)) { throw "PyCmd.exe is not in %LOCALAPPDATA%\Programs\PyCmd" }
          $link = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\PyCmd.lnk"
          if (-not (Test-Path $link)) { throw "there is no Start menu shortcut" }
          $desk = Join-Path ([Environment]::GetFolderPath("Desktop")) "PyCmd.lnk"
          if (-not (Test-Path $desk)) { throw "there is no desktop shortcut" }
          $v = Start-Process $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "installed-version.txt"
          if ($v.ExitCode -ne 0) { throw "the installed PyCmd would not start" }
          Write-Host ("installed: " + (Get-Content installed-version.txt -Raw))
          $u = Start-Process $setup -ArgumentList $quiet -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "installing over the top (an update) exited $($u.ExitCode)" }
          $uninstaller = Join-Path (Split-Path $exe) "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "there is no uninstaller" }
          Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          foreach ($i in 1..30) { if (-not (Test-Path $exe)) { break }; Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw "uninstalling left PyCmd.exe behind" }
          Write-Host "installs, updates and uninstalls"

      - name: Report its size and hash
        shell: pwsh
        run: |
          $exe = Get-Item dist-windows/build/PyCmd.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host ("size:   {0:N1} MB" -f ($exe.Length / 1MB))
          Write-Host "sha256: $hash"
          "PYCMD_SHA=$hash" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PyCmd-windows
          path: |
            dist-windows/build/PyCmd.exe
            dist-windows/build/PyCmd-Setup.exe
          if-no-files-found: error

      # The point of building on Windows rather than cross-compiling: these are
      # the toolchains a real user might have, and PyCmd should drive the ones
      # this runner ships with.
      #
      # Clang++ on Windows uses the Visual Studio headers, libraries and
      # linker. A plain runner shell does not set those paths, even though
      # clang++ is on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and run in every language the runner has
        timeout-minutes: 12
        run: python tools/test_toolchains_live.py

      - name: Publish it, if this is a release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $version = $tag -replace "^windows-(v)?", ""
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Started by hand: put the tag on the commit that was just built. A
          # release created on GitHub with the wrong branch selected points at
          # code this exe was not built from; moving the tag makes the release's
          # source downloads match the exe attached to it.
          if ("${{ github.ref_type }}" -ne "tag") {
            git tag -f $tag HEAD
            git push -f origin "refs/tags/$tag"
          }
          $notes = python -c "import json; print(json.load(open('dist-windows/latest.json', encoding='utf-8'))['notes'] or '')"
          if (-not $notes) { $notes = "PyCmd for Windows $version" }
          # Describes the exe that is about to be attached to this release,
          # and points the manifest at it there. The binary itself is not
          # committed - see .gitignore - so this commit is one small JSON
          # file and a checksum, whatever the size of the build.
          python tools/make_latest_windows.py dist-windows/build/PyCmd.exe --notes "$notes" --tag $tag
          python tools/make_latest_windows.py   # and prove what it wrote is true
          python tools/release_notes_windows.py $version $env:PYCMD_SHA > release-notes.md
          "PYCMD_VERSION=$version" >> $env:GITHUB_ENV
          git add dist-windows/latest.json dist-windows/SHA256SUMS.txt
          git commit -m "PyCmd for Windows $version"
          git push origin HEAD:windowsmain

      - uses: softprops/action-gh-release@v2
        if: env.RELEASE_TAG != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PyCmd for Windows ${{ env.PYCMD_VERSION }}
          body_path: release-notes.md
          make_latest: true
          files: |
            dist-windows/build/PyCmd-Setup.exe
            dist-windows/build/PyCmd.exe
          overwrite_files: true
          fail_on_unmatched_files: true
