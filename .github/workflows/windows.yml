# Builds PyCmd.exe on a real Windows machine.
#
# This exists because the exe cannot honestly be built anywhere else. Windows
# is where PyInstaller produces a Windows binary, and it is the only place the
# result can be started to see whether it opens. So the repository holds the
# source and the recipe, and this makes the artefact.
#
# Push a tag like `windows-v1.0.0` and it builds, checks, hashes and attaches
# the exe to a release. Run it by hand from the Actions tab to get a build
# without publishing one.

name: PyCmd for Windows

on:
  push:
    tags: ["windows-v*"]
    branches: [windowsmain]
    paths:
      - "windows/**"
      - "app/src/main/python/**"
      - "app/src/main/assets/**"
      - "tools/test_windows.py"
      - ".github/workflows/windows.yml"
  pull_request:
    paths: ["windows/**", "app/src/main/python/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # A ceiling, because a hung step is otherwise six hours of somebody's
    # runner minutes. Everything here should finish inside fifteen.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Without this, setup-python looks for a requirements.txt at the
          # repository root, finds none, and fails the whole job in one
          # second - every step after it skipped. The build's requirements
          # live with the build.
          cache-dependency-path: windows/build/requirements.txt

      - name: Install what the build needs
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/build/requirements.txt

      - name: A tag must agree with the version in the source
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: python tools/make_latest_windows.py --agrees-with-tag "${{ github.ref_name }}"

      - name: Check
        run: python tools/test_windows.py

      - name: Build
        run: python -m PyInstaller windows/build/pycmd.spec --noconfirm --distpath dist-windows/build

      - name: Prove it starts and the bundle is complete
        shell: pwsh
        run: |
          $exe = "dist-windows/build/PyCmd.exe"
          if (-not (Test-Path $exe)) { throw "no exe was produced" }

          # Start-Process -Wait, not `& $exe`. This is a windowed build, and
          # PowerShell does not wait for a GUI-subsystem process invoked with
          # the call operator - it returns at once and $LASTEXITCODE means
          # nothing. -Wait -PassThru gives a real exit code.
          #
          # --selftest boots the whole engine inside the packed exe: it
          # imports the shared modules, installs the five bundled plugins,
          # and checks the web assets and guides are in the bundle. A missing
          # hidden import shows up here and nowhere else, because from a
          # checkout every file is on the disk anyway.
          $log = "selftest.txt"
          $run = Start-Process -FilePath $exe -ArgumentList "--selftest" `
                   -Wait -PassThru -NoNewWindow `
                   -RedirectStandardOutput $log -RedirectStandardError "selftest-err.txt"
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if (Test-Path "selftest-err.txt") { Get-Content "selftest-err.txt" | Write-Host }
          if ($run.ExitCode -ne 0) {
            throw "the exe ran but its bundle is not complete (exit $($run.ExitCode))"
          }
          Write-Host "the bundle is complete"

          # Informational. A windowed build may have nowhere to print when its
          # output is not redirected, so this is not something to fail on - the
          # exit code above is the proof.
          $v = Start-Process -FilePath $exe -ArgumentList "--version" `
                 -Wait -PassThru -NoNewWindow -RedirectStandardOutput "version.txt"
          if (Test-Path "version.txt") { Write-Host ("it says: " + (Get-Content "version.txt" -Raw)) }
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }

      - name: Report its size and hash
        shell: pwsh
        run: |
          $exe = Get-Item dist-windows/build/PyCmd.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host ("size:   {0:N1} MB" -f ($exe.Length / 1MB))
          Write-Host "sha256: $hash"
          "PYCMD_SHA=$hash" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PyCmd-windows
          path: dist-windows/build/PyCmd.exe
          if-no-files-found: error

      # The point of building on Windows rather than cross-compiling: these are
      # the toolchains a real user might have, and PyCmd should drive the ones
      # this runner ships with.
      #
      # After the exe and allowed to fail, deliberately. It tests *this
      # machine's* compilers, not the build - whether the runner's Kotlin is
      # having a bad day should not cost anybody a release. What it finds is
      # worth reading; what it finds is not worth blocking on. The suite above
      # is the gate.
      - name: Compile and run in every language the runner has
        continue-on-error: true
        timeout-minutes: 12
        run: python tools/test_toolchains_live.py

      - name: Publish it, if this is a tag
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace "^windows-v", ""
          # Describes the exe that is about to be attached to this release,
          # and points the manifest at it there. The binary itself is not
          # committed - see .gitignore - so this commit is one small JSON
          # file and a checksum, whatever the size of the build.
          python tools/make_latest_windows.py dist-windows/build/PyCmd.exe `
            --notes "PyCmd for Windows $version" --tag "${{ github.ref_name }}"
          python tools/make_latest_windows.py   # and prove what it wrote is true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist-windows/latest.json dist-windows/SHA256SUMS.txt
          git commit -m "PyCmd for Windows $version"
          git push origin HEAD:windowsmain

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/windows-v')
        with:
          files: dist-windows/build/PyCmd.exe
          body: |
            PyCmd for Windows.

            One exe, nothing to install. Windows 10 or newer, 64-bit.

            SHA-256: `${{ env.PYCMD_SHA }}`
